name: Account-free native request signing probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-request-signing
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check bounded signing reports
        run: python3 -m unittest discover -s tests -p 'test_native_request_signing.py' -v
      - name: Compile account-free signing probe
        run: clang -fobjc-arc -framework Foundation tools/NativeRequestSigning.m -o native-request-signing
      - name: Check public signing policy and synthetic signature without authorization
        timeout-minutes: 3
        run: |
          ulimit -c 0
          python3 tools/native_request_signing.py
