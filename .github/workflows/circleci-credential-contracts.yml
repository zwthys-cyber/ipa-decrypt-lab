name: CircleCI credential envelope contracts
on:
  push:
    branches: [upgrade/managed-runtime-v0.2]
    paths:
      - 'deploy/managed/circleci/*credential*'
      - '.github/workflows/circleci-credential-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: circleci-credential-contracts
  cancel-in-progress: false
jobs:
  synthetic-envelopes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install standard authenticated age transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Verify ephemeral encryption and exact job binding with synthetic credentials
        working-directory: deploy/managed/circleci
        run: python3 test_credential_envelope.py -v
