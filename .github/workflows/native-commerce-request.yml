name: Account-free CommerceKit request construction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-commerce-request
  cancel-in-progress: false
jobs:
  construct:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Lakr233/ApplePackage
          ref: 391bfe6ee6598d73e4f94b88b38b50bd6f6ec67b
          path: identity-source/ApplePackage
          persist-credentials: false
      - name: Check bounded request and privacy contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_native_commerce*.py' -v
          python3 -m unittest discover -s tests -p 'test_native_keybag.py' -v
          python3 -m unittest discover -s tests -p 'test_machine_enrollment.py' -v
      - name: Build the synthetic request constructor
        run: |
          swiftc identity-source/ApplePackage/Sources/ApplePackage/Configuration/DeviceIdentifier.swift tools/NativeDeviceIdentity.swift -o native-device-identity
          clang -g -fobjc-arc -framework Foundation tools/NativeCommerceRequest.m -o native-commerce-request
          ./native-commerce-request --binding-contract
          clang -g -fobjc-arc -framework Foundation tools/NativeMachineEnrollment.m -o native-machine-enrollment
          ./native-machine-enrollment --response-contract
      - name: Construct without submitting a server authorization request
        timeout-minutes: 1
        run: |
          ulimit -c 0
          python3 tools/native_commerce_request.py
          python3 tools/commerce_enrollment_preflight.py
