name: Persist the proven independent TestFlight session as private ciphertext
on:
  push:
    branches: [main]
    paths: ['.github/ops/tf_session_promote.py', '.github/workflows/testflight-session-promote.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight-session-promotion
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify routing, immutable ciphertext and durable intents without credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_testflight_routing.py' -v
          python3 -m unittest discover -s .github/ops -p 'test_tf_task_session.py' -v
  promote:
    needs: public
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tf-session-promote-once]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install transport and envelope encryption on GitHub only
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age sshpass
      - name: Preserve the verified independent identity without a new Apple request
        env:
          TF_VIRTUAL_RESTORE_RUN: '42694923538'
          DELIVERY_AGE_IDENTITY: ${{ secrets.DELIVERY_AGE_IDENTITY }}
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: python3 .github/ops/tf_session_promote.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && hashFiles('tf-session-promotion-receipt.json') != ''
        with:
          name: tf-session-promotion-${{ github.run_id }}
          path: tf-session-promotion-receipt.json
          retention-days: 1
          if-no-files-found: error
