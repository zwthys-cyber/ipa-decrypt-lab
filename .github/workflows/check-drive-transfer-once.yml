name: Verify private link registration on the hosted pilot D1 database
on:
  push:
    branches: ['ops/configure-free-pilot-20261124']
    paths: ['.github/workflows/check-drive-transfer-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: configure-existing-free-pilot-once
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'zwthys-cyber/ipa-decrypt-lab' && github.ref == 'refs/heads/ops/configure-free-pilot-20261124' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Obtain only verified public program files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          gh api repos/zwthys-cyber/ipa-decrypt-lab/actions/artifacts/14937919929/zip > "$RUNNER_TEMP/pilot-public.zip"
          gh api 'repos/zwthys-cyber/ipa-decrypt-lab/contents/deploy/managed/free-pilot/drive-auth.mjs?ref=2d3560232bc6f0b7d831a6adf5eb7b861e0c5c68' > "$RUNNER_TEMP/public-auth.json"
          gh api 'repos/zwthys-cyber/ipa-decrypt-lab/contents/deploy/managed/free-pilot/drive-smoke.mjs?ref=c05329d6ffb51b4ed03b6e62dd942c2561545dc3' > "$RUNNER_TEMP/public-smoke.json"
          gh api 'repos/zwthys-cyber/ipa-decrypt-lab/contents/deploy/managed/free-pilot/private-link.mjs?ref=c05329d6ffb51b4ed03b6e62dd942c2561545dc3' > "$RUNNER_TEMP/public-link.json"
          python3 - <<'PY'
          import base64,hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          archive=root/"pilot-public.zip"
          assert archive.stat().st_size<=131072 and hashlib.sha256(archive.read_bytes()).hexdigest()=="c3f74dd6c06d42018b0c934ec228808caea5c87415a7f54e7062a4737a374f73"
          with zipfile.ZipFile(archive) as z:
              assert z.read("BUILDINFO").decode().splitlines()==["source_head=2d3560232bc6f0b7d831a6adf5eb7b861e0c5c68","checked_out_commit=ebb6ab6fc04e6888c9e52359284cd1e468a36379"]
              assert z.namelist().count("worker.mjs")==1 and z.getinfo("worker.mjs").file_size<131072
              code=z.read("worker.mjs")
              assert [x.split()[0] for x in z.read("SHA256SUMS").decode().splitlines() if len(x.split())==2 and x.split()[1]=="worker.mjs"]==[hashlib.sha256(code).hexdigest()]
              (root/"worker.mjs").write_bytes(code)
          meta=json.loads((root/"public-auth.json").read_text())
          code=base64.b64decode(meta["content"])
          assert hashlib.sha1(b"blob "+str(len(code)).encode()+b"\0"+code).hexdigest()=="539982a5366bdb83c88c467e8ef4383e1cfb61a9"
          (root/"drive-auth.mjs").write_bytes(code)
          meta=json.loads((root/"public-smoke.json").read_text())
          code=base64.b64decode(meta["content"])
          assert hashlib.sha1(b"blob "+str(len(code)).encode()+b"\0"+code).hexdigest()=="a9eb3dbb75424cb87fc014d7b1bec55c01f737c0"
          (root/"drive-smoke.mjs").write_bytes(code)
          meta=json.loads((root/"public-link.json").read_text())
          code=base64.b64decode(meta["content"])
          assert hashlib.sha1(b"blob "+str(len(code)).encode()+b"\0"+code).hexdigest()=="59e382137fc5ea4a00646cb7cf70f0b853a361b5"
          (root/"private-link.mjs").write_bytes(code)
          print("public_source_verified")
          PY
          node --check "$RUNNER_TEMP/worker.mjs"
          node --check "$RUNNER_TEMP/drive-auth.mjs"
          node --check "$RUNNER_TEMP/drive-smoke.mjs"
          node --check "$RUNNER_TEMP/private-link.mjs"
      - name: Read-only verification of the existing synthetic fixture
        env:
          CF_PILOT_ACCOUNT_ID: ${{ secrets.CF_PILOT_ACCOUNT_ID }}
          CF_PILOT_API_TOKEN: ${{ secrets.CF_PILOT_API_TOKEN }}
        run: |
          set -eu
          umask 077
          python3 - <<'PY'
          import base64,hashlib,http.client,json,os,re,secrets,ssl,subprocess,sys,time
          from pathlib import Path
          HOST="ipazake-free-control-pilot.hahayesadd.workers.dev"
          WORKER="ipazake-free-control-pilot"
          DATE="2026-07-30"
          FLAGS={"PILOT_ENABLED","PILOT_LINK_ENABLED"}
          EXPECTED={"PILOT_DRIVE_CLIENT_ID","PILOT_DRIVE_CLIENT_SECRET","PILOT_DRIVE_REFRESH_TOKEN","PILOT_DRIVE_RECIPIENT_EMAIL"}
          NAMES={"DB"}|FLAGS|EXPECTED
          class Stop(Exception):pass
          def need(ok,code):
              if not ok:raise Stop(code)
          def call(host,method,path,headers=None,body=None):
              conn=http.client.HTTPSConnection(host,443,timeout=100,context=ssl.create_default_context())
              try:
                  conn.request(method,path,body=body,headers=headers or {})
                  r=conn.getresponse();raw=r.read(524289)
                  need(len(raw)<=524288,"response_too_large")
                  return r.status,raw
              finally:conn.close()
          def cf(method,path,body=None,content_type="application/json"):
              status,raw=call("api.cloudflare.com",method,path,{"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":content_type},body)
              if status not in (200,201):
                  print("cloudflare_http_status="+str(status),flush=True)
                  try:
                      errors=json.loads(raw).get("errors",[])
                      codes=sorted({item["code"] for item in errors[:20] if isinstance(item,dict) and type(item.get("code")) is int and 0<item["code"]<1000000})
                      if codes: print("cloudflare_error_codes="+",".join(map(str,codes)),flush=True)
                  except (AttributeError, TypeError, ValueError):
                      pass
                  raise Stop("cloudflare_request_unconfirmed")
              value=json.loads(raw)
              need(isinstance(value,dict) and value.get("success") is True and isinstance(value.get("result"),dict),"cloudflare_request_unconfirmed")
              return value["result"]
          def uuid(value):
              return isinstance(value,str) and re.fullmatch(r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}",value)
          def bindings(version):
              r=version.get("resources",{})
              rows=r.get("bindings")
              need(isinstance(rows,list),"binding_metadata_unconfirmed")
              names={}
              for item in rows:
                  need(isinstance(item,dict) and isinstance(item.get("name"),str),"binding_metadata_invalid")
                  name=item["name"]
                  need(name in NAMES and name not in names,"unexpected_binding")
                  names[name]=item
              # Report binding names and declared types only. Never print their values.
              for name in sorted(EXPECTED):
                  kind=names.get(name,{}).get("type","missing")
                  if kind not in ("secret_text","plain_text","json","missing","secrets_store_secret"):kind="other"
                  print("binding_type "+name+" "+kind,flush=True)
              need(set(names)==NAMES,"binding_names_unconfirmed")
              need(all(names[n].get("type")=="secret_text" for n in EXPECTED),"secret_binding_type_unconfirmed")
              need(all(names[n].get("type")=="plain_text" and names[n].get("text")=="0" for n in FLAGS),"pilot_not_disabled")
              db=names["DB"];dbid=db.get("id") or db.get("database_id")
              need(db.get("type")=="d1" and uuid(dbid),"d1_binding_unconfirmed")
              runtime=r.get("script_runtime",{})
              need(runtime.get("compatibility_date")==DATE and not runtime.get("compatibility_flags"),"runtime_configuration_unexpected")
              need(not runtime.get("migration_tag") and not runtime.get("exports"),"unexpected_runtime_resources")
              return dbid
          def active():
              rows=cf("GET",root+"/deployments?per_page=1").get("deployments")
              need(isinstance(rows,list) and rows,"deployment_missing")
              versions=rows[0].get("versions")
              need(isinstance(versions,list) and 1<=len(versions)<=2,"unexpected_deployment_shape")
              result={}
              for item in versions:
                  vid=item.get("version_id");percent=item.get("percentage")
                  need(uuid(vid) and isinstance(percent,(int,float)) and vid not in result,"invalid_deployment")
                  result[vid]=percent
              return result
          def latest():
              rows=cf("GET",root+"/versions?per_page=1").get("items")
              need(isinstance(rows,list) and rows and uuid(rows[0].get("id")),"latest_version_missing")
              return rows[0]["id"]
          def deploy(versions):
              cf("POST",root+"/deployments",json.dumps({"strategy":"percentage","versions":[{"version_id":v,"percentage":p} for v,p in versions.items()]}).encode())
          def probe_disabled():
              for method,path,status in (("GET","/",404),("POST","/telegram",503)):
                  code,raw=call(HOST,method,path,{"Content-Type":"application/json"} if method=="POST" else {},b"{}" if method=="POST" else None)
                  need(code==status and json.loads(raw)=={"ok":False},"pilot_endpoint_unexpected")
          stage="input";old=None;new=None;attempted=False;success=False
          try:
              account=os.environ.get("CF_PILOT_ACCOUNT_ID","");token=os.environ.get("CF_PILOT_API_TOKEN","")
              need(re.fullmatch(r"[0-9a-fA-F]{32}",account) and re.fullmatch(r"[A-Za-z0-9_-]{20,256}",token),"cloudflare_credentials_unavailable")
              root="/client/v4/accounts/"+account+"/workers/scripts/"+WORKER
              stage="preflight"
              probe_disabled()
              current=active()
              need(len(current)==1 and list(current.values())==[100],"active_deployment_not_single")
              old=next(iter(current))
              dbid=bindings(cf("GET",root+"/versions/"+old))
              previous_latest=latest()
              # Fresh random challenge never persisted or logged; public code has only its hash.
              challenge=secrets.token_hex(32);digest=hashlib.sha256(challenge.encode()).hexdigest()
              expires=int(time.time())+240
              public_probe=r'''
          import base from "./worker.mjs";
          import {smokeTransfer} from "./drive-smoke.mjs";
          import {LINK_SQL,MAX,WINDOW} from "./private-link.mjs";
          const expected="__HASH__";
          const expires=__EXPIRY__;
          const host="ipazake-free-control-pilot.hahayesadd.workers.dev";
          function reply(status,obj){return Response.json(obj,{status,headers:{"Cache-Control":"no-store"}})}
          function fail(stage){return reply(503,{probe:"drive-readonly-v1",ok:false,stage})}
          async function verifyHostedD1(db){
            const suffix=crypto.randomUUID().replaceAll("-","");
            const job="pilot_"+suffix;
            const owner="synthetic:"+suffix;
            const file="synthetic_"+suffix;
            const filename="HostedD1Synthetic.zip";
            const digest="a".repeat(64);
            const now=Math.floor(Date.now()/1000);
            const expires=now+WINDOW;
            const registration=()=>db.prepare(LINK_SQL.register).bind(file,filename,MAX,digest,expires,job,owner);
            const lookup=(identity,at)=>db.prepare(LINK_SQL.lookup).bind(job,identity,at);
            // One D1 transaction. Plain INSERT aborts the batch on a collision; every cleanup is fixture-scoped.
            const [inserted,registered,duplicate,retrieved,foreign,expired,cancelled,afterCancel,linkRemoved,jobRemoved,residue]=await db.batch([
              db.prepare("INSERT INTO pilot_jobs(job_id,owner_id,update_id,app_id,region,day,created_at,state) VALUES(?,?,0,'123456','default',?,?,'waiting_for_runtime')").bind(job,owner,Math.floor(now/86400),now),
              registration(),
              registration(),
              lookup(owner,now),
              lookup(owner+":other",now),
              lookup(owner,expires),
              db.prepare("UPDATE pilot_jobs SET state='cancelled' WHERE job_id=? AND owner_id=?").bind(job,owner),
              lookup(owner,now),
              db.prepare("DELETE FROM pilot_links WHERE job_id=? AND owner_id=? AND file_id=?").bind(job,owner,file),
              db.prepare("DELETE FROM pilot_jobs WHERE job_id=? AND owner_id=?").bind(job,owner),
              db.prepare("SELECT (SELECT COUNT(*) FROM pilot_jobs WHERE job_id=?)+(SELECT COUNT(*) FROM pilot_links WHERE job_id=?) AS remaining").bind(job,job)
            ]);
            const row=retrieved.results?.[0];
            return [inserted,registered,cancelled,linkRemoved,jobRemoved].every(r=>r.success===true&&r.meta.changes===1)&&
              duplicate.success===true&&duplicate.meta.changes===0&&
              retrieved.success===true&&retrieved.results.length===1&&row.file_id===file&&row.filename===filename&&row.bytes===MAX&&
              row.sha256===digest&&row.expires_at===expires&&
              [foreign,expired,afterCancel].every(r=>r.success===true&&r.results.length===0)&&
              residue.success===true&&residue.results[0]?.remaining===0;
          }
          export default {async fetch(request,env,ctx){
            const u=new URL(request.url);
            if(u.pathname!=="/__drive_readonly_probe")return base.fetch(request,env,ctx);
            if(u.hostname!==host||u.search||!["GET","POST"].includes(request.method)||Date.now()/1000>=expires||
               env.PILOT_ENABLED!=="0"||env.PILOT_LINK_ENABLED!=="0")return reply(404,{ok:false});
            const candidate=request.headers.get("X-Pilot-Check")||"";
            if(!/^[a-f0-9]{64}$/.test(candidate))return reply(404,{ok:false});
            const actual=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(candidate)))].map(x=>x.toString(16).padStart(2,"0")).join("");
            let diff=0;for(let i=0;i<64;i++)diff|=actual.charCodeAt(i)^expected.charCodeAt(i);
            if(diff)return reply(404,{ok:false});
            if(request.method==="GET")return reply(200,{probe:"synthetic-fixture-inspection-v1",ready:true});
            let reason="oauth_network";
            const send=async(url,init)=>{
              if(url!=="https://oauth2.googleapis.com/token"){
                if(new URL(url).origin!=="https://www.googleapis.com")throw Error("unexpected_endpoint");
                return fetch(url,init);
              }
              let r;
              try{
                r=await fetch(url,{...init,redirect:"manual",signal:AbortSignal.timeout(10000)});
              }catch(e){
                const msg=String(e?.message||"").toLowerCase();
                reason=msg.includes("illegal invocation")?"oauth_illegal_invocation":
                  msg.includes("timeout")||e?.name==="TimeoutError"||e?.name==="AbortError"?"oauth_timeout":
                  msg.includes("dns")||msg.includes("resolve")?"oauth_dns":
                  msg.includes("tls")||msg.includes("certificate")?"oauth_tls":
                  msg.includes("network connection lost")?"oauth_connection_lost":"oauth_network";
                throw Error("oauth_transport");
              }
              if(r.status>=300&&r.status<400){reason="oauth_redirect";if(r.body)await r.body.cancel();throw Error("oauth_redirect")}
              reason="oauth_response";
              if(!r.body)throw Error("response");
              const reader=r.body.getReader(),parts=[];let n=0;
              try{for(;;){const {done,value}=await reader.read();if(done)break;n+=value.byteLength;if(n>16384){await reader.cancel();throw Error("response")}parts.push(value)}}
              finally{reader.releaseLock()}
              const bytes=new Uint8Array(n);let at=0;for(const p of parts){bytes.set(p,at);at+=p.byteLength}
              const v=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(bytes));
              if(r.status!==200){
                const known=["invalid_grant","invalid_client","unauthorized_client","invalid_scope","invalid_request","access_denied","admin_policy_enforced","temporarily_unavailable"];
                reason=known.includes(v?.error)?"google_"+v.error:"google_other_error";
              }else if(typeof v?.scope!=="string")reason="oauth_scope_missing";
              else if(v.scope.trim()!=="https://www.googleapis.com/auth/drive.file")reason="oauth_scope_mismatch";
              else reason="oauth_token_validation";
              return new Response(bytes,{status:r.status,headers:{"Content-Type":"application/json"}});
            };
            const result=await smokeTransfer(env,send,{allowCreate:false,verifyLink:true});
            if(!result.ok&&result.stage==="oauth")result.stage=reason;
            if(result.ok){
              let verified=false;
              try{verified=await verifyHostedD1(env.DB);}catch{}
              if(!verified)return reply(503,{probe:"synthetic-fixture-inspection-v1",ok:false,stage:"hosted_d1",upload_may_exist:false});
              result.hosted_d1_verified=true;
            }
            return reply(result.ok?200:503,{probe:"synthetic-fixture-inspection-v1",...result});
          }};
          '''.replace("__HASH__",digest).replace("__EXPIRY__",str(expires)).encode()
              files=Path(os.environ["RUNNER_TEMP"])
              (files/"probe.mjs").write_bytes(public_probe)
              subprocess.run(["node","--check",str(files/"probe.mjs")],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              # Inherit existing Cloudflare bindings in place. No secret value is fetched or exported.
              metadata={"main_module":"probe.mjs","compatibility_date":DATE,
                        "bindings":[{"name":name,"type":"inherit","version_id":old} for name in sorted(NAMES)],
                        "annotations":{"workers/message":"Expiring read-only synthetic fixture verification; zero traffic"}}
              metadata["modules"]=[
                  {"name":name,"content_type":"application/javascript+module",
                   "content_base64":base64.b64encode((files/name).read_bytes()).decode("ascii")}
                  for name in ("probe.mjs","worker.mjs","drive-auth.mjs","drive-smoke.mjs","private-link.mjs")
              ]
              body=json.dumps(metadata,separators=(",",":")).encode()
              stage="upload_probe_version"
              need(active()=={old:100} and latest()==previous_latest,"concurrent_deployment_detected")
              versions_root="/client/v4/accounts/"+account+"/workers/workers/"+WORKER+"/versions"
              new=cf("POST",versions_root+"?deploy=false",body).get("id")
              need(uuid(new),"probe_version_unconfirmed")
              need(bindings(cf("GET",root+"/versions/"+new))==dbid,"binding_preservation_unconfirmed")
              need(active()=={old:100} and latest()==new,"concurrent_deployment_detected")
              stage="zero_traffic_probe"
              attempted=True
              deploy({old:100,new:0})
              need(active()=={old:100,new:0},"zero_traffic_unconfirmed")
              headers={"X-Pilot-Check":challenge,"Cloudflare-Workers-Version-Overrides":WORKER+'="'+new+'"',"Cache-Control":"no-store"}
              ready=False
              for _ in range(5):
                  status,raw=call(HOST,"GET","/__drive_readonly_probe",headers)
                  if status==404:
                      time.sleep(2);continue
                  value=json.loads(raw)
                  need(status==200 and value=={"probe":"synthetic-fixture-inspection-v1","ready":True},"probe_readiness_unconfirmed")
                  ready=True
                  break
              need(ready,"probe_routing_unconfirmed")
              # Exactly one inspection. The probe cannot create a Drive file.
              stage="existing_synthetic_fixture"
              status,raw=call(HOST,"POST","/__drive_readonly_probe",headers,b"")
              value=json.loads(raw)
              need(value.get("probe")=="synthetic-fixture-inspection-v1","transfer_outcome_unconfirmed")
              if status==503:
                  failure=value.get("stage")
                  if failure not in {"configuration","oauth","oauth_network","oauth_illegal_invocation","oauth_timeout","oauth_dns","oauth_tls","oauth_connection_lost","oauth_redirect","oauth_response","oauth_scope_missing","oauth_scope_mismatch","oauth_token_validation","google_invalid_grant","google_invalid_client","google_unauthorized_client","google_invalid_scope","google_invalid_request","google_access_denied","google_admin_policy_enforced","google_temporarily_unavailable","google_other_error","quota_request","quota_response","quota_api_forbidden","quota_api_unauthorized","quota_api_limited","quota_api_unavailable","account_mismatch","quota_unavailable","quota_not_free_compatible","quota_insufficient","existing_fixture","fixture_missing","metadata","metadata_missing","metadata_identity","metadata_owner","metadata_size","metadata_digest_missing","metadata_digest_mismatch","metadata_mime","metadata_resource_key","acl","download","private_link","hosted_d1"}:failure="unknown"
                  need(value.get("upload_may_exist") is False,"unexpected_upload_state")
                  raise Stop("transfer_"+failure)
              fixture=("ipazake free pilot transfer verification; synthetic data only.\n"+"-"*1024).encode()[:1024]
              expected_fixture_hash=hashlib.sha256(fixture).hexdigest()
              need(status==200 and value.get("ok") is True and value.get("owner_only") is True and value.get("bytes")==1024 and value.get("created") is False and value.get("private_link_verified") is True and value.get("hosted_d1_verified") is True and value.get("sha256")==expected_fixture_hash,"transfer_unconfirmed")
              print("hosted_d1_verified: registered=true; duplicate_blocked=true; owner_only=true; expired_blocked=true; cancelled_blocked=true; exact_10gb_metadata=true; fixture_rows_remaining=0",flush=True)
              success=True
          except Stop as exc:
              print("stopped_stage="+stage+"; reason="+str(exc),file=sys.stderr,flush=True)
          except Exception:
              print("stopped_stage="+stage+"; operation_unconfirmed",file=sys.stderr,flush=True)
          finally:
              if attempted:
                  try:
                      current=active()
                      if current=={old:100,new:0}:deploy({old:100})
                      else:need(current=={old:100},"concurrent_deployment_detected")
                      need(active()=={old:100},"restore_unconfirmed")
                      probe_disabled()
                      print("original_deployment_restored: pilot_disabled=true",flush=True)
                  except Exception:
                      print("original_deployment_restore_unconfirmed; temporary probe expires automatically",file=sys.stderr,flush=True)
                      success=False
              if not success:sys.exit(2)
          PY
