name: Query CN historical version catalog
run-name: versions-${{ inputs.request_id }}-app${{ inputs.app_id }}
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Free CN App Store numeric ID
        type: string
        required: true
      request_id:
        description: CN-bound opaque request ID
        type: string
        required: true
      paged:
        description: Return a bounded cursor page (new controller)
        type: boolean
        default: false
      before:
        description: Optional exclusive Apple external-version cursor
        type: string
        default: ''
  workflow_call:
    inputs:
      app_id:
        type: string
        required: true
      request_id:
        type: string
        required: true
      paged:
        type: boolean
        default: true
      before:
        type: string
        default: ''
    secrets:
      APPLE_CN_ID:
        required: true
      APPLE_CN_GUID:
        required: true
      APPLE_CN_SESSION_B64:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: private-ipa-delivery
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      LAB_BUILD_JOBS: '4'
      DELIVERY_ACCOUNT_PROFILE: cn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check public eligibility before loading runtime
        env:
          DELIVERY_APP_ID: ${{ inputs.app_id }}
          DELIVERY_VERSION: historical
        run: python3 tools/app_preflight.py
      - name: Prepare verified precompiled runtime
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ops/cn_runtime.py fetch runtime
      - name: Restore fixed Apple resource cache
        id: apple-assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: runtime/lab-kbsync --prewarm
      - name: Save validated Apple resources before account access
        if: steps.apple-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Query authenticated historical metadata without downloading IPA
        env:
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_GUID: ${{ secrets.APPLE_CN_GUID }}
          APPLE_CN_SESSION_B64: ${{ secrets.APPLE_CN_SESSION_B64 }}
          CATALOG_ACCOUNT_PROFILE: cn
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/runtime/lab-kbsync
          CATALOG_APP_ID: ${{ inputs.app_id }}
          CATALOG_REQUEST_ID: ${{ inputs.request_id }}
          CATALOG_BEFORE: ${{ inputs.before }}
          CATALOG_PAGED: ${{ inputs.paged && '1' || '0' }}
        run: |
          ulimit -c 0
          python3 tools/version_catalog_worker.py runtime/ApplePackageTool
      - name: Retain sanitized version metadata for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: versions-${{ inputs.request_id }}
          path: catalog-out/versions.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove catalog workspace
        if: always()
        run: rm -rf -- catalog-out
