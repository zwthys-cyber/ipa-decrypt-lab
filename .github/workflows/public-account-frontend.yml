name: Public Apple account frontend inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-account-frontend
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect advertised public account frontend without credentials
        timeout-minutes: 3
        run: python3 tools/public_account_frontend.py
