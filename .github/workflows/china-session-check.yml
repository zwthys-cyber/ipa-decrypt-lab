name: Verify saved China account session
run-name: CN-session-${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synthetic checks, or one read-only query using the saved CN session
        type: choice
        default: test
        options: [test, query, native-query]
permissions:
  contents: read
  actions: read
concurrency:
  group: china-account-onboarding
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.mode != 'test' && 'macos-26-intel' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify account binding and read-only behavior without secrets
        run: |
          python3 -m unittest discover -s .github/ops -p 'test_*.py' -v
          node --test .github/ops/cn_action.test.cjs
      - name: Query saved CN session without login, password or verification code
        if: inputs.mode == 'query'
        env:
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_GUID: ${{ secrets.APPLE_CN_GUID }}
          APPLE_CN_SESSION_B64: ${{ secrets.APPLE_CN_SESSION_B64 }}
        run: |
          ulimit -c 0
          python3 .github/ops/cn_session.py
      - name: Fetch verified CN runtime without account secrets
        if: inputs.mode == 'native-query'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ops/cn_runtime.py fetch cn-runtime
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: inputs.mode == 'native-query'
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Verify native public resources
        if: inputs.mode == 'native-query'
        run: cn-runtime/lab-kbsync --prewarm
      - name: Refresh CN cookies and query count with native device proofs
        if: inputs.mode == 'native-query'
        env:
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_GUID: ${{ secrets.APPLE_CN_GUID }}
          APPLE_CN_SESSION_B64: ${{ secrets.APPLE_CN_SESSION_B64 }}
        run: |
          ulimit -c 0
          python3 .github/ops/cn_native_summary.py --binary cn-runtime/ApplePackageTool
      - name: Publish only a sanitized session-reuse receipt
        if: always() && inputs.mode != 'test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cn-session-receipt-${{ github.run_id }}
          path: |
            cn-session-receipt.json
            cn-session-secret-relay.json
          retention-days: 1
          if-no-files-found: ignore
