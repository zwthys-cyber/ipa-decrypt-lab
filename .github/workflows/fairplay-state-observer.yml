name: Account-free FairPlay state visibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fairplay-state-visibility
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test bounded metadata observation and privacy
        run: |
          python3 -m unittest discover -s tests -p 'test_fairplay_state_observer.py' -v
          python3 -m unittest discover -s tests -p 'test_observed_enrollment.py' -v
          python3 -m unittest discover -s tests -p 'test_machine_enrollment.py' -v
          python3 -m unittest discover -s tests -p 'test_store_account_summary.py' -v
      - name: Compare current-user and administrator visibility without credentials
        timeout-minutes: 2
        run: python3 tools/fairplay_state_observer.py
