name: Account-free native keybag prerequisites
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-keybag-prerequisites
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify report privacy and bounded account-free execution
        run: python3 -m unittest discover -s tests -p 'test_native_keybag.py' -v
      - name: Build native local keybag prerequisite probe
        timeout-minutes: 2
        run: clang -fobjc-arc -framework Foundation tools/NativeKeybag.m -o native-keybag
      - name: Inspect interfaces and generate only synthetic local sync data
        timeout-minutes: 2
        run: |
          ulimit -c 0
          python3 tools/native_keybag.py
