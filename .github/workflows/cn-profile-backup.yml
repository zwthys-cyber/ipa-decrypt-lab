name: Preserve existing CN profile without Apple access
run-name: CN-profile-backup-${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Seal the current CN profile or verify the saved repository Secret round trip
        type: choice
        default: verify
        options: [prepare, verify]
permissions:
  contents: read
concurrency:
  group: china-account-onboarding
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FiloSottile/age
          ref: b74dce4cdbe35b5e5f66c06d9612b72f89028758
          path: public-source/age
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
          cache-dependency-path: public-source/age/go.sum
      - name: Check source bindings and repository-only sealing before private inputs
        run: |
          python3 -m compileall -q .github/ops
          python3 -m unittest discover -s .github/ops -p 'test_*.py' -v
          node --test .github/ops/cn_action.test.cjs
          mkdir -p public-source/age/cmd/lab-cn-backup-seal arm-runtime
          cp .github/ops/cn_backup_seal.go public-source/age/cmd/lab-cn-backup-seal/main.go
          cp .github/ops/cn_backup_seal_test.go public-source/age/cmd/lab-cn-backup-seal/main_test.go
          cd public-source/age
          go test -p 2 -timeout 120s ./cmd/lab-cn-backup-seal
          go build -p 2 -trimpath -o ../../arm-runtime/cn-backup-seal ./cmd/lab-cn-backup-seal
      - name: Seal or verify only the existing China profile without network authentication
        env:
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_GUID: ${{ secrets.APPLE_CN_GUID }}
          APPLE_CN_SESSION_B64: ${{ secrets.APPLE_CN_SESSION_B64 }}
          FAIRPLAY_CN_STATE_B64: ${{ secrets.FAIRPLAY_CN_STATE_B64 }}
          CN_RECOVERY_BACKUP_B64: ${{ inputs.mode == 'verify' && secrets.CN_RECOVERY_BACKUP_B64 || '' }}
          CN_BACKUP_VERIFY_REQUIRED: ${{ inputs.mode == 'verify' && 'true' || 'false' }}
        run: python3 .github/ops/cn_arm_model.py --mode backup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cn-profile-backup-result-${{ github.run_id }}
          path: |
            cn-arm-backup-receipt.json
            cn-recovery-backup-secret-relay.json
          retention-days: 1
          if-no-files-found: ignore
