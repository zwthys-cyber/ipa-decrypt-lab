name: Native engine feasibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure bounded release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test synthetic contracts
        run: |
          ulimit -c 0
          ctest --test-dir build --output-on-failure
      - name: Record native runtime capability
        shell: bash
        run: |
          ulimit -c 0
          mkdir -p reports
          build/ipa-engine probe > reports/capability.json
          build/ipa-engine self-test > reports/native-selftest.json
          build/ipa-engine diagnose > reports/native-controls.jsonl
          cat reports/capability.json
          cat reports/native-selftest.json
          cat reports/native-controls.jsonl
          {
            echo '### Native runtime capability'
            echo 'Synthetic tests do not prove real IPA decryption.'
            echo '```json'
            cat reports/capability.json
            cat reports/native-selftest.json
            cat reports/native-controls.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipa-engine-${{ matrix.os }}
          path: |
            build/ipa-engine
            reports/capability.json
            reports/native-selftest.json
            reports/native-controls.jsonl
            tools/ipa_audit.py
          retention-days: 3
          if-no-files-found: error
