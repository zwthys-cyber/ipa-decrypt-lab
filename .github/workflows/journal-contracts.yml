name: Bounded session recovery verification
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  write:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test all Python contracts without credentials
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Write synthetic recovery record
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: tools
        run: |
          python3 - <<'PY'
          import hashlib, os
          from delivery_journal import Journal
          from telegram_queue import GitHub
          token="synthetic-recovery-"+os.environ["GITHUB_RUN_ID"]
          rid=hashlib.sha256(token.encode()).hexdigest()[:32]
          journal=Journal(GitHub(os.environ["GH_TOKEN"]),token,123456789)
          journal.write(rid,"pending","6599842047")
          print("synthetic_journal_write_verified")
          PY
  recover:
    needs: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Recover on a fresh runner without Apple or Telegram credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: tools
        run: |
          python3 - <<'PY'
          import hashlib, os, time
          from delivery_journal import Journal
          from telegram_queue import GitHub
          token="synthetic-recovery-"+os.environ["GITHUB_RUN_ID"]
          rid=hashlib.sha256(token.encode()).hexdigest()[:32]
          api=GitHub(os.environ["GH_TOKEN"])
          journal=Journal(api,token,123456789)
          for attempt in range(6):
              journal.load()
              if rid in journal.records:
                  break
              time.sleep(3)
          assert journal.records[rid]["state"]=="pending"
          assert len(journal.pending())==1
          assert Journal(api,token,123456790).load()=={}
          journal.write(rid,"sending")
          journal.write(rid,"delivered")
          fresh=Journal(api,token,123456789)
          for attempt in range(6):
              fresh.load()
              if fresh.records.get(rid,{}).get("state")=="delivered":
                  break
              time.sleep(3)
          assert fresh.records[rid]["state"]=="delivered"
          assert fresh.pending()==[]
          print("synthetic_cross_runner_recovery_verified; no Telegram file sent")
          PY
