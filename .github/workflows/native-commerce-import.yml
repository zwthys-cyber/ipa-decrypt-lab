name: Account-free CommerceKit invalid import observation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-commerce-import
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check reporting, negative evidence and privacy
        run: |
          python3 -m unittest discover -s tests -p 'test_native_commerce*.py' -v
          python3 -m unittest discover -s tests -p 'test_commerce_import_logs.py' -v
      - name: Build fixed synthetic controls
        run: |
          clang -g -fobjc-arc -framework Foundation tools/NativeCommerceKeybag.m -o native-commerce-keybag
          ./native-commerce-keybag --error-contract
          clang -g -fobjc-arc -framework Foundation tools/NativeCommerceImport.m -o native-commerce-import
      - name: Observe baseline and fixed invalid bags as the runner user
        timeout-minutes: 2
        run: |
          ulimit -c 0
          python3 tools/native_commerce_import.py
