name: Independent Swift Store trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-swift-store
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Lakr233/ApplePackage
          ref: 391bfe6ee6598d73e4f94b88b38b50bd6f6ec67b
          path: native-source/ApplePackage
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: majd/ipatool
          ref: d9c0247daea564d3ec7d04a9b015d0a29af66b04
          path: native-source/ipatool
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: native-source/ipatool/go.mod
          cache: true
          cache-dependency-path: native-source/ipatool/go.sum
      - name: Build and test bounded kbsync helper
        run: |
          mkdir -p native-source/ipatool/cmd/lab-kbsync
          cp tools/kbsync_main.go native-source/ipatool/cmd/lab-kbsync/main.go
          cp tests/kbsync_main_test.go native-source/ipatool/cmd/lab-kbsync/main_test.go
          cd native-source/ipatool
          go test ./cmd/lab-kbsync
          go build -o ../../lab-kbsync ./cmd/lab-kbsync
      - name: Test Python orchestrator before native compilation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Swift toolchain and correct ambiguous diagnostics
        run: |
          swift --version
          python3 tools/patch_swift_diagnostics.py native-source/ApplePackage
          python3 tools/patch_ent_download.py native-source/ApplePackage
      - name: Restore public-source Swift build cache
        id: swift-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: native-source/ApplePackage/.build
          key: swift-macos15-arm64-xcode26.2-391bfe6-${{ hashFiles('tools/patch_swift_diagnostics.py', 'tools/patch_ent_download.py', 'tools/LabEntDownload.swift', 'tests/LabEntDownloadTests.swift') }}
          restore-keys: |
            swift-macos15-arm64-xcode26.2-391bfe6-
      - name: Test independent signing request construction
        working-directory: native-source/ApplePackage
        run: swift test -j 2 --filter 'SAPAuthenticationRequestTests|LabEntDownloadTests'
      - name: Build independent native client
        working-directory: native-source/ApplePackage
        run: swift build -j 2 --product ApplePackageTool
      - name: Test orchestrator and build diagnostic engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ulimit -c 0
          ctest --test-dir build --output-on-failure
      - name: Save public-source build cache before credentials are supplied
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: native-source/ApplePackage/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: ./lab-kbsync --prewarm
      - name: Authenticate and acquire without exporting account or IPA
        env:
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/lab-kbsync
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_2FA_CODE: ${{ secrets.APPLE_2FA_CODE }}
        run: |
          ulimit -c 0
          python3 tools/native_store.py --binary native-source/ApplePackage/.build/debug/ApplePackageTool --engine build/ipa-engine
