name: QQ 9.3.86 isolated static inspection
on:
  push:
    branches: [codex/qq-9386-inspect]
    paths:
      - .github/workflows/qq-9386-inspect.yml
      - .github/qq-inspect/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/qq-9386-inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test metadata reader against synthetic layouts
        run: python3 -m unittest discover -s .github/qq-inspect -p 'test_metadata.py' -v
      - name: Install pinned static instruction decoder
        run: python3 -m pip install capstone==5.0.3
      - name: Inspect only fixed QQ delivery without executing QQ
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_AGE_IDENTITY: ${{ secrets.DELIVERY_AGE_IDENTITY }}
        run: python3 .github/qq-inspect/inspect.py
      - name: Inspect public custom device page without account credentials
        run: python3 .github/qq-inspect/device_page.py
      - name: Retain interface metadata only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qq-9386-static-interfaces
          path: qq-interface-report/interfaces.json
          retention-days: 1
          if-no-files-found: error
