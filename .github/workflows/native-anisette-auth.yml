name: Native AuthKit independent Anisette trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-app-store-account-trial
  cancel-in-progress: false
jobs:
  trial:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test private transport and authentication report contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_anisette_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_native_anisette_auth.py' -v
      - name: Compile native helpers and verify account-free callback contract
        timeout-minutes: 2
        run: |
          clang -fobjc-arc -framework Foundation tools/AuthKitBridge.m -o authkit-bridge
          clang -fobjc-arc -framework Foundation tools/NativeAnisetteAuth.m -o native-anisette-auth
          python3 tools/authkit_bridge.py
      - name: Fetch pinned independent provider
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: malmeloo/Anisette.py
          ref: a61cddfb2275187822ad0c3999af747b8c9a4f9a
          path: vendor/anisette
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.9.13'
          enable-cache: false
      - name: Install provider from frozen dependency lock
        run: uv sync --project vendor/anisette --frozen --no-dev --no-default-groups --python 3.12
      - name: Fetch public Apple libraries directly from Apple
        timeout-minutes: 3
        run: |
          curl --fail --location --max-time 120 --max-filesize 314572800 \
            --proto '=https' --proto-redir '=https' \
            --output applemusic.apk \
            https://apps.mzstatic.com/content/android-apple-music-apk/applemusic.apk
          shasum -a 256 applemusic.apk
      - name: Attempt one ephemeral authentication with private fresh-data callbacks
        timeout-minutes: 4
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          ulimit -c 0
          vendor/anisette/.venv/bin/python tools/native_anisette_auth.py applemusic.apk ./native-anisette-auth
      - name: Delete disposable public library package
        if: always()
        run: rm -f applemusic.apk
