name: Isolated virtual Mac TestFlight research
run-name: TF-virtual-Mac-research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testflight-virtual.yml'
      - '.github/ops/tf_virtual*'
      - '.github/ops/test_tf_virtual.py'
  workflow_dispatch:
    inputs:
      run_control:
        description: Prewarm Mac Store signing, then run one explicit live authentication
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight-virtual-research
  cancel-in-progress: false
jobs:
  virtual:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apple-auth/apple-auth
          ref: 98c862f7bebc8283a9b87f1578e703f0765dc81d
          path: native-source/apple-auth
          persist-credentials: false
      - name: Install public build and encryption dependencies
        run: brew install cmake ninja pkgconf mbedtls@3 curl nlohmann-json libzip age
      - name: Test privacy and state guards without account inputs
        run: |
          python3 -m unittest discover -s .github/ops -p 'test_tf_virtual*.py'
          python3 -m unittest discover -s .github/ops -p 'test_tf_invitation.py'
          node --test .github/ops/cn_action.test.cjs
      - name: Compile isolated client without Apple inputs
        run: |
          python3 .github/ops/tf_virtual_transport_patch.py native-source/apple-auth/src/client/transport.cpp
          python3 .github/ops/tf_virtual_auth_patch.py native-source/apple-auth/src/client/authentication.cpp
          python3 .github/ops/tf_virtual_pet_patch.py native-source/apple-auth/src/client/authentication.cpp native-source/apple-auth/src/client/store.cpp native-source/apple-auth/src/client/client.cpp
          cp .github/ops/tf_virtual_pet_contract.cpp native-source/apple-auth/lab_tf_pet_contract.cpp
          cp .github/ops/tf_sdk_contract.cpp native-source/apple-auth/tf_sdk_contract.cpp
          cp .github/ops/tf_virtual_client.cpp native-source/apple-auth/tf_virtual_client.cpp
          cp .github/ops/tf_virtual_transport_bridge.cpp native-source/apple-auth/lab_tf_transport_bridge.cpp
          cp .github/ops/tf_virtual_auth_contract.cpp native-source/apple-auth/lab_tf_auth_contract.cpp
          cat .github/ops/tf_sdk_contract.cmake >> native-source/apple-auth/CMakeLists.txt
          cat .github/ops/tf_virtual_client.cmake >> native-source/apple-auth/CMakeLists.txt
          cat .github/ops/tf_sdk_compat.cmake >> native-source/apple-auth/CMakeLists.txt
          tf_prefix="$(brew --prefix mbedtls@3);$(brew --prefix curl);$(brew --prefix nlohmann-json);$(brew --prefix libzip)"
          cmake -S native-source/apple-auth -B tf-sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$tf_prefix" -DAPPLE_AUTH_WITH_TESTFLIGHT=ON -DAPPLE_AUTH_BUILD_EXAMPLES=ON
          cmake --build tf-sdk-build --parallel 4
          ctest --test-dir tf-sdk-build --output-on-failure --no-tests=error --timeout 180
      - name: Authenticate once after Mac Store signing is prepared
        if: ${{ inputs.run_control || (github.event_name == 'push' && contains(github.event.head_commit.message, '[tf-virtual-control-once]')) }}
        env:
          TF_VIRTUAL_RESTORE_RUN: '42662277216'
          TF_VIRTUAL_LIVE_OTP: '1'
          CN_LIVE_TASK: tf_virtual_auth
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_PASSWORD: ${{ secrets.APPLE_CN_PASSWORD }}
          TF_VIRTUAL_NOT_BEFORE: '1794245200'
          DELIVERY_AGE_IDENTITY: ${{ secrets.DELIVERY_AGE_IDENTITY }}
          GH_TOKEN: ${{ github.token }}
          TF_CURL_FRESH_GSA: '1'
        uses: ./.github/actions/cn-auth
      - name: Retain only encrypted state and a closed receipt
        if: ${{ always() && hashFiles('tf-virtual-receipt.json') != '' && (inputs.run_control || (github.event_name == 'push' && contains(github.event.head_commit.message, '[tf-virtual-control-once]'))) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tf-virtual-sealed-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            tf-virtual-state.age
            tf-virtual-receipt.json
          retention-days: 1
          if-no-files-found: error

# Explicit dedicated live maintenance after signing prewarm; one bound code, no enrollment.

# Retry scheduler-only internal error 42672190788: no runner or account request executed.
