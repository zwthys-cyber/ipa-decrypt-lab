name: Build official Telegram large-file server
on:
  workflow_dispatch:
    inputs:
      reuse_vps_run:
        description: Optional successful main VPS producer with the same pinned public Bot API
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-server-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tdlib/telegram-bot-api
          ref: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
          submodules: recursive
          persist-credentials: false
      - name: Install public build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gperf libssl-dev zlib1g-dev cmake ninja-build
      - name: Restore compiled public binary
        id: binary-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dist/telegram-bot-api
          key: telegram-bot-api-ubuntu24-x64-e3e9dd8e5b3d7ab-v1
      - name: Recover identical pinned Bot API from a verified public CI bundle
        id: recovery
        if: steps.binary-cache.outputs.cache-hit != 'true' && inputs.reuse_vps_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_VPS_RUN: ${{ inputs.reuse_vps_run }}
        run: |
          python3 - <<'PYRECOVER'
          import base64,hashlib,io,json,os,re,shutil,subprocess,tarfile,tempfile,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          identifier=os.environ['REUSE_VPS_RUN']
          assert re.fullmatch(r'[1-9][0-9]{0,19}',identifier)
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+path],text=True))
          run=api('/actions/runs/'+identifier)
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/vps-release.yml' and run['head_branch']=='main'
          assert run['event']=='workflow_dispatch'
          workflow=api('/contents/.github/workflows/vps-release.yml?ref='+run['head_sha'])
          source=base64.b64decode(workflow['content']).decode()
          expected_key='telegram-bot-api-ubuntu24-x64-e3e9dd8e5b3d7ab-v1'
          assert 'key: '+expected_key in source
          artifacts=api('/actions/runs/'+identifier+'/artifacts')['artifacts']
          found=[a for a in artifacts if a['name']=='vps-controller-'+run['head_sha'] and not a['expired']]
          assert len(found)==1 and 0<found[0]['size_in_bytes']<=256*1024*1024
          item=found[0]
          raw=subprocess.check_output(['gh','api','repos/'+repo+'/actions/artifacts/'+str(item['id'])+'/zip'])
          assert len(raw)<=256*1024*1024 and 'sha256:'+hashlib.sha256(raw).hexdigest()==item['digest']
          with zipfile.ZipFile(io.BytesIO(raw)) as zipped:
              entries=zipped.infolist()
              assert len(entries)==2 and {e.filename for e in entries}=={'vps-controller.tar.gz','vps-controller.sha256'}
              assert sum(e.file_size for e in entries)<=256*1024*1024
              packed=zipped.read('vps-controller.tar.gz')
              assert hashlib.sha256(packed).hexdigest()==zipped.read('vps-controller.sha256').decode().split()[0]
          with tarfile.open(fileobj=io.BytesIO(packed),mode='r:gz') as archive:
              members=archive.getmembers()
              binaries=[m for m in members if m.name.removeprefix('./')=='bin/telegram-bot-api']
              commits=[m for m in members if m.name.removeprefix('./')=='SOURCE_COMMIT']
              assert len(binaries)==len(commits)==1
              binary=binaries[0]
              assert binary.isfile() and not binary.sparse and 0<binary.size<=128*1024*1024
              assert commits[0].isfile() and commits[0].size<=128
              assert archive.extractfile(commits[0]).read().decode().strip()==run['head_sha']
              Path('dist').mkdir(exist_ok=True)
              target=Path('dist/telegram-bot-api')
              with archive.extractfile(binary) as src,target.open('xb') as dst:
                  shutil.copyfileobj(src,dst,1024*1024)
              target.chmod(0o755)
          with open(os.environ['GITHUB_OUTPUT'],'a') as outputs:
              outputs.write('restored=true\n')
          print(json.dumps({'reused_public_artifact':item['id'],'upstream_commit':'e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1'}))
          PYRECOVER
      - name: Compile official local Bot API
        if: steps.binary-cache.outputs.cache-hit != 'true' && steps.recovery.outputs.restored != 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=OFF
          cmake --build build --target telegram-bot-api --parallel 2
          mkdir -p dist
          cp build/telegram-bot-api dist/telegram-bot-api
      - name: Verify public executable
        run: dist/telegram-bot-api --version
      - name: Cache public executable only
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dist/telegram-bot-api
          key: telegram-bot-api-ubuntu24-x64-e3e9dd8e5b3d7ab-v1
