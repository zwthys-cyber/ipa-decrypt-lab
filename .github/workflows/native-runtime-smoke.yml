name: Verify precompiled runtime on fresh runners
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test workflow and loader contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch and verify runtime from successful producer
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/native_runtime.py fetch --output runtime
      - name: Start relocated native binaries
        run: |
          runtime/ApplePackageTool --help
          runtime/offline-engine --help
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: runtime/lab-kbsync --prewarm
