name: Authorized IPA diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authorized-ipa-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build native trial engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Trial without exporting input or candidates
        env:
          AUTHORIZED_IPA_URL: ${{ secrets.AUTHORIZED_IPA_URL }}
        run: |
          ulimit -c 0
          python3 tools/private_trial.py build/ipa-engine > "$RUNNER_TEMP/ipa-trial-summary.json"
          {
            echo '### Diagnostic only; no verified decryption'
            cat "$RUNNER_TEMP/ipa-trial-summary.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove summary
        if: always()
        run: rm -f "$RUNNER_TEMP/ipa-trial-summary.json"
