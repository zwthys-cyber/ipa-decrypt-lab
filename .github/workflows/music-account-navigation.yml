name: Account-free official Music sign-in navigation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-account-navigation
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile bounded official Music navigation probe
        run: clang -Wall -Wextra -Werror -fobjc-arc -framework Foundation -framework AppKit -framework ApplicationServices tools/NativeMusicAccountNavigation.m -o music-account-navigation
      - name: Verify forbidden actions and private-value reporting contract
        run: ./music-account-navigation --contract
      - name: Open official sign-in dialog without credentials
        timeout-minutes: 1
        run: |
          ulimit -c 0
          ./music-account-navigation
