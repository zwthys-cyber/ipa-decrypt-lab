name: Audit TestFlight migration source
on:
  push:
    branches: ['upgrade/managed-runtime-v0.2']
    paths:
      - '.github/ops/tf_ledger_source_audit.py'
      - '.github/ops/test_tf_ledger_source_audit.py'
      - '.github/workflows/tf-ledger-source-audit.yml'
  pull_request:
    paths:
      - '.github/ops/tf_ledger_source_audit.py'
      - '.github/ops/test_tf_ledger_source_audit.py'
      - '.github/workflows/tf-ledger-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-account-worker
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify read-only inventory with synthetic databases on GitHub only
        run: python3 -m unittest discover -s .github/ops -p 'test_tf_ledger_source_audit.py' -v
  source:
    needs: public
    if: >-
      github.run_attempt == 1 &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upgrade/managed-runtime-v0.2') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[tf-ledger-source-audit]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SSH client on the GitHub runner only
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Read the existing source without initializing or changing its ledgers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          inspection_dir=$(mktemp -d)
          trap 'rm -rf -- "$inspection_dir"' EXIT
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$inspection_dir/known_hosts"
          if ! sshpass -e ssh -o "UserKnownHostsFile=$inspection_dir/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o LogLevel=ERROR "root@$VPS_HOST" \
            'env LAB_RUNTIME=vps PYTHONDONTWRITEBYTECODE=1 python3 -' \
            < .github/ops/tf_ledger_source_audit.py > "$inspection_dir/result" 2> "$inspection_dir/error"; then
            echo source_audit_failed
            exit 1
          fi
          AUDIT_RESULT="$inspection_dir/result" python3 - <<'PY'
          import json,os,pathlib
          keys={"schema","status","service_idle_observed","tf_tasks_total","tf_tasks_unfinished",
                "session_ciphertext_present","acceptance_ledger_present","acceptance_ledger_valid",
                "known_acceptance_confirmed","acceptance_rows","unresolved_acceptance_rows",
                "acceptance_candidates","private_return_rows","private_return_unknown"}
          try:
              raw=pathlib.Path(os.environ["AUDIT_RESULT"]).read_bytes()
              assert len(raw)<=4096
              result=json.loads(raw)
              assert type(result) is dict and set(result)==keys
              assert result["schema"]=="ipa-tf-source-audit-v1"
              assert result["status"]=="source_inventory_observed"
              for key in keys-{"schema","status"}:
                  assert type(result[key]) is bool or (type(result[key]) is int and 0<=result[key]<=100000)
          except Exception:
              raise SystemExit("source_audit_failed")
          print(json.dumps(result,sort_keys=True))
          PY
