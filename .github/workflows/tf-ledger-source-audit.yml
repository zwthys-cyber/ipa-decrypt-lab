name: Audit TestFlight migration source
on:
  push:
    branches: ['upgrade/managed-runtime-v0.2']
    paths:
      - '.github/ops/tf_ledger_source_audit.py'
      - '.github/ops/test_tf_ledger_source_audit.py'
      - '.github/workflows/tf-ledger-source-audit.yml'
  pull_request:
    paths:
      - '.github/ops/tf_ledger_source_audit.py'
      - '.github/ops/test_tf_ledger_source_audit.py'
      - '.github/workflows/tf-ledger-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-account-worker
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify read-only inventory with synthetic databases on GitHub only
        run: python3 -m unittest discover -s .github/ops -p 'test_tf_ledger_source_audit.py' -v
  source:
    needs: public
    if: >-
      github.run_attempt == 1 &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upgrade/managed-runtime-v0.2') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[tf-ledger-source-audit]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SSH client on the GitHub runner only
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Read the existing source without initializing or changing its ledgers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          inspection_dir=$(mktemp -d)
          trap 'rm -rf -- "$inspection_dir"' EXIT
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$inspection_dir/known_hosts"
          audit_ssh_status=0
          sshpass -e ssh -4 -o "UserKnownHostsFile=$inspection_dir/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o LogLevel=ERROR "root@$VPS_HOST" \
            'env LAB_RUNTIME=vps PYTHONDONTWRITEBYTECODE=1 python3 -' \
            < .github/ops/tf_ledger_source_audit.py > "$inspection_dir/result" 2> "$inspection_dir/error" || audit_ssh_status=$?
          if [ "$audit_ssh_status" -ne 0 ]; then
            AUDIT_SSH_STATUS="$audit_ssh_status" AUDIT_ERROR="$inspection_dir/error" AUDIT_RESULT="$inspection_dir/result" python3 - <<'PY'
          import json,os,pathlib
          error=pathlib.Path(os.environ["AUDIT_ERROR"]).read_bytes()[:16384]
          code="source_audit_transport_failed"
          for needle,label in ((b"Connection timed out","source_audit_transport_timeout"),
                               (b"Operation timed out","source_audit_transport_timeout"),
                               (b"Operation not permitted","source_audit_transport_denied"),
                               (b"Host is down","source_audit_network_unreachable"),
                               (b"Connection refused","source_audit_transport_refused"),
                               (b"Permission denied","source_audit_authentication_failed"),
                               (b"Host key verification failed","source_audit_host_key_failed"),
                               (b"REMOTE HOST IDENTIFICATION HAS CHANGED","source_audit_host_key_failed"),
                               (b"No route to host","source_audit_network_unreachable"),
                               (b"Could not resolve hostname","source_audit_dns_failed"),
                               (b"Address family for hostname not supported","source_audit_ip_family_unavailable"),
                               (b"Network is unreachable","source_audit_network_unreachable"),
                               (b"Connection reset","source_audit_connection_reset"),
                               (b"Connection closed","source_audit_connection_closed"),
                               (b"kex_exchange_identification","source_audit_handshake_failed"),
                               (b"no matching host key","source_audit_algorithm_unavailable"),
                               (b"Broken pipe","source_audit_connection_closed"),
                               (b"Failed to run command","source_audit_local_client_failed")):
              if needle in error:
                  code=label
                  break
          transport={"schema":"ipa-tf-source-transport-v1","status":code,
                     "ssh_exit_code":int(os.environ["AUDIT_SSH_STATUS"]),"stderr_bytes":len(error),
                     "result_bytes":pathlib.Path(os.environ["AUDIT_RESULT"]).stat().st_size}
          try:
              value=json.loads(pathlib.Path(os.environ["AUDIT_RESULT"]).read_bytes()[:4096])
              if (type(value) is dict and set(value)=={"schema","status","stage"} and
                  value["schema"]=="ipa-tf-source-audit-v1" and value["status"]=="source_audit_failed" and
                  value["stage"] in {"runtime","root","health","controller","session","acceptance","candidates","returns"}):
                  print(json.dumps(value,sort_keys=True))
              else:
                  print(json.dumps(transport,sort_keys=True))
          except Exception:
              print(json.dumps(transport,sort_keys=True))
          PY
            exit 1
          fi
          AUDIT_RESULT="$inspection_dir/result" python3 - <<'PY'
          import json,os,pathlib
          keys={"schema","status","stage","health_recent","service_idle_observed","tf_tasks_total","tf_tasks_unfinished",
                "session_ciphertext_present","session_matches_promoted_ciphertext","acceptance_ledger_present","acceptance_ledger_valid",
                "known_acceptance_confirmed","acceptance_rows","unresolved_acceptance_rows",
                "acceptance_candidates","private_return_rows","private_return_unknown"}
          try:
              raw=pathlib.Path(os.environ["AUDIT_RESULT"]).read_bytes()
              assert len(raw)<=4096
              result=json.loads(raw)
              assert type(result) is dict and set(result)==keys
              assert result["schema"]=="ipa-tf-source-audit-v1"
              assert result["status"]=="source_inventory_observed"
              assert result["stage"]=="complete"
              for key in keys-{"schema","status","stage"}:
                  assert type(result[key]) is bool or (type(result[key]) is int and 0<=result[key]<=100000)
          except Exception:
              raise SystemExit("source_audit_failed")
          print(json.dumps(result,sort_keys=True))
          PY
