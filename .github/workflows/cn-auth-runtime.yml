name: Build isolated CN live-auth client
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build verified native runtime"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: cn-auth-runtime
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: macos-26-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch verified base components without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/native_runtime.py fetch --output base-runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Lakr233/ApplePackage
          ref: 391bfe6ee6598d73e4f94b88b38b50bd6f6ec67b
          path: native-source/ApplePackage
          persist-credentials: false
      - name: Apply production fixes and separate CN command
        run: |
          python3 tools/patch_swift_diagnostics.py native-source/ApplePackage
          python3 tools/patch_ent_download.py native-source/ApplePackage
          python3 .github/ops/patch_cn_login.py native-source/ApplePackage
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: swift
        with:
          path: native-source/ApplePackage/.build
          key: cn-live-auth-macos26-x64-xcode26.2-${{ hashFiles('.github/ops/ChinaLogin.swift', '.github/ops/LabCNSummary.swift', '.github/ops/LabCNSummaryTests.swift', '.github/ops/LabCNLoginFlow.swift', '.github/ops/LabCNLoginFlowTests.swift', '.github/ops/patch_cn_login.py', 'tools/patch_swift_diagnostics.py', 'tools/patch_ent_download.py', 'tools/StoreAMD.swift', 'tools/StoreBagTransport.m') }}
          restore-keys: |
            cn-live-auth-macos26-x64-xcode26.2-
            swift-macos26-X64-xcode26.2-391bfe6-
      - name: Compile and test CN session plus existing authentication contracts
        working-directory: native-source/ApplePackage
        run: |
          swift build -j 4 --build-tests
          swift test --skip-build --filter 'SAPAuthenticationRequestTests|LabEntDownloadTests|LabAuthRouteTests|LabStoreAMD|LabCNLoginFlowTests|LabCNSummaryTests'
          swift build -j 4 --product ApplePackageTool
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.swift.outputs.cache-hit != 'true'
        with:
          path: native-source/ApplePackage/.build
          key: ${{ steps.swift.outputs.cache-primary-key }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FiloSottile/age
          ref: b74dce4cdbe35b5e5f66c06d9612b72f89028758
          path: native-source/age
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
          cache-dependency-path: native-source/age/go.sum
      - name: Test and build GitHub-recipient-only CN session sealing
        run: |
          mkdir -p native-source/age/cmd/lab-cn-session-seal
          cp .github/ops/cn_session_seal.go native-source/age/cmd/lab-cn-session-seal/main.go
          cp .github/ops/cn_session_seal_test.go native-source/age/cmd/lab-cn-session-seal/main_test.go
          cd native-source/age
          go test -p 2 -timeout 120s ./cmd/lab-cn-session-seal
          go build -p 2 -trimpath -o ../../cn-session-seal ./cmd/lab-cn-session-seal
          mkdir -p cmd/lab-cn-model-seal
          cp ../../.github/ops/cn_model_seal.go cmd/lab-cn-model-seal/main.go
          cp ../../.github/ops/cn_model_seal_test.go cmd/lab-cn-model-seal/main_test.go
          go test -p 2 -timeout 120s ./cmd/lab-cn-model-seal
          go build -p 2 -trimpath -o ../../cn-model-seal ./cmd/lab-cn-model-seal
      - name: Build and verify native model prerequisites without any account
        run: |
          clang -dynamiclib -Wall -Wextra tools/NativeImportIO.c -install_name @rpath/libNativeImportIO.dylib -o libNativeImportIO.dylib
          clang -fobjc-arc -DLAB_IMPORT_IO -framework Foundation tools/NativeMachineEnrollment.m -L. -lNativeImportIO -Wl,-rpath,@executable_path -o native-machine-enrollment
          native_machine_path="$PWD/native-machine-enrollment"
          "$native_machine_path" --io-contract
          "$native_machine_path" --response-contract
          swiftc native-source/ApplePackage/Sources/ApplePackage/Configuration/DeviceIdentifier.swift tools/NativeDeviceIdentity.swift -o native-device-identity
          python3 tools/commerce_enrollment_preflight.py
          mkdir cn-model-support
          cp native-machine-enrollment libNativeImportIO.dylib native-device-identity cn-model-seal cn-model-support/
      - name: Identify CN source fingerprint
        id: source
        run: echo "fingerprint=$(python3 .github/ops/cn_runtime.py fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Package only verified public CN variant and verify relocation
        run: |
          python3 .github/ops/cn_runtime.py pack
          mv native-source/ApplePackage/.build native-source/ApplePackage/.build-hidden
          relocated-cn-runtime/ApplePackageTool --help
          relocated-cn-runtime/ApplePackageTool login-cn --help
          relocated-cn-runtime/ApplePackageTool resume-cn --help
          relocated-cn-runtime/ApplePackageTool summary-cn --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cn-auth-runtime-macos-26-intel-${{ steps.source.outputs.fingerprint }}
          path: cn-runtime-out/native-runtime.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cn-session-sealer-macos-26-intel-${{ steps.source.outputs.fingerprint }}
          path: cn-session-seal
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cn-model-support-macos-26-intel-${{ steps.source.outputs.fingerprint }}
          path: cn-model-support/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
