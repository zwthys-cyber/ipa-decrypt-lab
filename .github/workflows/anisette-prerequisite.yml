name: Independent Anisette prerequisite probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-anisette-prerequisite
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test privacy, endpoint and prerequisite contracts
        run: python3 -m unittest discover -s tests -p 'test_anisette_probe.py' -v
      - name: Fetch pinned open-source provider
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: malmeloo/Anisette.py
          ref: a61cddfb2275187822ad0c3999af747b8c9a4f9a
          path: vendor/anisette
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.9.13'
          enable-cache: false
      - name: Install provider with its frozen dependency lock
        run: uv sync --project vendor/anisette --frozen --no-dev --no-default-groups --python 3.12
      - name: Fetch public Apple libraries directly from Apple
        timeout-minutes: 3
        run: |
          curl --fail --location --max-time 120 --max-filesize 314572800 \
            --proto '=https' --proto-redir '=https' \
            --output applemusic.apk \
            https://apps.mzstatic.com/content/android-apple-music-apk/applemusic.apk
          sha256sum applemusic.apk
      - name: Provision once and verify private session reuse without an Apple account
        timeout-minutes: 3
        run: |
          ulimit -c 0
          vendor/anisette/.venv/bin/python tools/anisette_probe.py applemusic.apk
      - name: Remove disposable public library package
        if: always()
        run: rm -f applemusic.apk
