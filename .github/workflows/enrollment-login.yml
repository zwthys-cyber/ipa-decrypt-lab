name: Native App Store enrollment login trial
on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted architecture for one bounded native login trial
        required: true
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-15-intel
permissions:
  contents: read
concurrency:
  group: native-app-store-account-trial
  cancel-in-progress: false
jobs:
  login:
    if: github.ref == 'refs/heads/main' && (inputs.runner == 'macos-15' || inputs.runner == 'macos-15-intel')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test private diagnostics before supplying credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_enrollment_environment.py' -v
          python3 -m unittest discover -s tests -p 'test_native_auth_diagnostics.py' -v
      - name: Confirm bounded system-log query before credentials are supplied
        run: python3 tools/native_auth_diagnostics.py --check
      - name: Compile native UI research helper before supplying credentials
        run: swiftc -swift-version 5 -framework AppKit -framework ApplicationServices -framework SystemConfiguration tools/EnrollmentEnvironment.swift -o enrollment-environment
      - name: One native account login with private diagnostics
        timeout-minutes: 5
        env:
          LAB_NATIVE_UI_AUTH: '1'
          LAB_NATIVE_AUTH_DIAGNOSTICS: '1'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          ulimit -c 0
          python3 tools/enrollment_environment.py
