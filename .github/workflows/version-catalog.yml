name: Query Apple historical version catalog
run-name: versions-${{ inputs.request_id }}-app${{ inputs.app_id }}
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Free US App Store numeric ID
        type: string
        required: true
      request_id:
        description: Opaque 32-character lowercase hex request ID
        type: string
        required: true
      runner:
        description: GitHub hosted macOS pool
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-15-intel]
permissions:
  contents: read
concurrency:
  group: private-ipa-delivery
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-26-intel' }}
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      LAB_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public eligibility before compilation
        env:
          DELIVERY_APP_ID: ${{ inputs.app_id }}
          DELIVERY_VERSION: historical
        run: python3 tools/app_preflight.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Lakr233/ApplePackage
          ref: 391bfe6ee6598d73e4f94b88b38b50bd6f6ec67b
          path: native-source/ApplePackage
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: majd/ipatool
          ref: d9c0247daea564d3ec7d04a9b015d0a29af66b04
          path: native-source/ipatool
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: native-source/ipatool/go.mod
          cache: true
          cache-dependency-path: native-source/ipatool/go.sum
      - name: Build and test bounded kbsync helper
        run: |
          mkdir -p native-source/ipatool/cmd/lab-kbsync
          cp tools/kbsync_main.go native-source/ipatool/cmd/lab-kbsync/main.go
          cp tests/kbsync_main_test.go native-source/ipatool/cmd/lab-kbsync/main_test.go
          cd native-source/ipatool
          go test ./cmd/lab-kbsync
          go build -o ../../lab-kbsync ./cmd/lab-kbsync
      - name: Test Python orchestrator before native compilation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Swift toolchain and correct ambiguous diagnostics
        run: |
          swift --version
          python3 tools/patch_swift_diagnostics.py native-source/ApplePackage
          python3 tools/patch_ent_download.py native-source/ApplePackage
      - name: Restore public-source Swift build cache
        id: swift-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: native-source/ApplePackage/.build
          key: swift-macos${{ startsWith(inputs.runner, 'macos-26') && '26' || '15' }}-${{ runner.arch }}-xcode26.2-391bfe6-${{ hashFiles('tools/patch_swift_diagnostics.py', 'tools/patch_ent_download.py', 'tools/LabEntDownload.swift', 'tests/LabEntDownloadTests.swift') }}
          restore-keys: |
            swift-macos${{ startsWith(inputs.runner, 'macos-26') && '26' || '15' }}-${{ runner.arch }}-xcode26.2-391bfe6-
      - name: Compile native client and test targets
        if: steps.swift-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        working-directory: native-source/ApplePackage
        run: swift build -j "$LAB_BUILD_JOBS" --build-tests
      - name: Test independent signing request construction
        if: steps.swift-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        working-directory: native-source/ApplePackage
        run: swift test --skip-build --filter 'SAPAuthenticationRequestTests|LabEntDownloadTests'
      - name: Build independent native client
        if: steps.swift-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: native-source/ApplePackage
        run: swift build -j "$LAB_BUILD_JOBS" --product ApplePackageTool
      - name: Verify cached or freshly built native client exists
        run: test -x native-source/ApplePackage/.build/debug/ApplePackageTool
      - name: Save public-source build cache before credentials are supplied
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: native-source/ApplePackage/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: ./lab-kbsync --prewarm
      - name: Query authenticated historical metadata without downloading IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/lab-kbsync
          CATALOG_APP_ID: ${{ inputs.app_id }}
          CATALOG_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          ulimit -c 0
          python3 tools/version_catalog_worker.py native-source/ApplePackage/.build/debug/ApplePackageTool
      - name: Retain sanitized version metadata for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: versions-${{ inputs.request_id }}
          path: catalog-out/versions.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove catalog workspace
        if: always()
        run: rm -rf -- catalog-out
