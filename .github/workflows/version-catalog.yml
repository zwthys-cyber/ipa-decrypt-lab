name: Query Apple historical version catalog
run-name: versions-${{ inputs.request_id }}-app${{ inputs.app_id }}
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Free US App Store numeric ID
        type: string
        required: true
      request_id:
        description: Opaque 32-character lowercase hex request ID
        type: string
        required: true
      runner:
        description: GitHub hosted macOS pool
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-15-intel]
permissions:
  contents: read
  actions: read
concurrency:
  group: private-ipa-delivery
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-26-intel' }}
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      LAB_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public eligibility before loading runtime
        env:
          DELIVERY_APP_ID: ${{ inputs.app_id }}
          DELIVERY_VERSION: historical
        run: python3 tools/app_preflight.py
      - name: Prepare verified precompiled runtime
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/native_runtime.py fetch --output runtime
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: runtime/lab-kbsync --prewarm
      - name: Query authenticated historical metadata without downloading IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/runtime/lab-kbsync
          CATALOG_APP_ID: ${{ inputs.app_id }}
          CATALOG_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          ulimit -c 0
          python3 tools/version_catalog_worker.py runtime/ApplePackageTool
      - name: Retain sanitized version metadata for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: versions-${{ inputs.request_id }}
          path: catalog-out/versions.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove catalog workspace
        if: always()
        run: rm -rf -- catalog-out
