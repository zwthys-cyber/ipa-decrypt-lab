name: CircleCI private credential lease
run-name: CircleCI lease ${{ inputs.job_id }}
on:
  push:
    branches: [upgrade/managed-runtime-v0.2]
    paths:
      - 'deploy/managed/circleci/publish_credentials.py'
      - '.github/workflows/circleci-secret-lease.yml'
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      profile:
        required: true
        type: choice
        options: [synthetic, default, cn, tf]
      source:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: circleci-lease-${{ inputs.job_id || github.sha }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          node --test deploy/managed/circleci/github-oidc.test.mjs
          python3 -m py_compile deploy/managed/circleci/publish_credentials.py

  synthetic:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/upgrade/managed-runtime-v0.2' && github.run_attempt == 1 && inputs.profile == 'synthetic'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Publish only the exact approved synthetic credential fields
        env:
          PUBLISH_JOB_ID: ${{ inputs.job_id }}
          PUBLISH_PROFILE: ${{ inputs.profile }}
          PUBLISH_SOURCE: ${{ inputs.source }}

        run: python3 deploy/managed/circleci/publish_credentials.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: credential-publisher-synthetic-${{ github.run_id }}
          path: credential-publisher-proof.json
          retention-days: 1
          if-no-files-found: error

  default:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/upgrade/managed-runtime-v0.2' && github.run_attempt == 1 && inputs.profile == 'default'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Publish only the exact approved default credential fields
        env:
          PUBLISH_JOB_ID: ${{ inputs.job_id }}
          PUBLISH_PROFILE: ${{ inputs.profile }}
          PUBLISH_SOURCE: ${{ inputs.source }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FAIRPLAY_MODEL_B64: ${{ secrets.FAIRPLAY_MODEL_B64 }}
        run: python3 deploy/managed/circleci/publish_credentials.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: credential-publisher-default-${{ github.run_id }}
          path: credential-publisher-proof.json
          retention-days: 1
          if-no-files-found: error

  cn:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/upgrade/managed-runtime-v0.2' && github.run_attempt == 1 && inputs.profile == 'cn'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Publish only the exact approved cn credential fields
        env:
          PUBLISH_JOB_ID: ${{ inputs.job_id }}
          PUBLISH_PROFILE: ${{ inputs.profile }}
          PUBLISH_SOURCE: ${{ inputs.source }}
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_GUID: ${{ secrets.APPLE_CN_GUID }}
          APPLE_CN_SESSION_B64: ${{ secrets.APPLE_CN_SESSION_B64 }}
          FAIRPLAY_CN_MODEL_B64: ${{ secrets.FAIRPLAY_CN_MODEL_B64 }}
          FAIRPLAY_CN_STATE_B64: ${{ secrets.FAIRPLAY_CN_STATE_B64 }}
        run: python3 deploy/managed/circleci/publish_credentials.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: credential-publisher-cn-${{ github.run_id }}
          path: credential-publisher-proof.json
          retention-days: 1
          if-no-files-found: error

  tf:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/upgrade/managed-runtime-v0.2' && github.run_attempt == 1 && inputs.profile == 'tf'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Publish only the exact approved tf credential fields
        env:
          PUBLISH_JOB_ID: ${{ inputs.job_id }}
          PUBLISH_PROFILE: ${{ inputs.profile }}
          PUBLISH_SOURCE: ${{ inputs.source }}
          TF_SAVED_SESSION_AGE_B64: ${{ secrets.TF_SAVED_SESSION_AGE_B64 }}
          DELIVERY_AGE_IDENTITY: ${{ secrets.DELIVERY_AGE_IDENTITY }}
          FAIRPLAY_CN_MODEL_B64: ${{ secrets.FAIRPLAY_CN_MODEL_B64 }}
        run: python3 deploy/managed/circleci/publish_credentials.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: credential-publisher-tf-${{ github.run_id }}
          path: credential-publisher-proof.json
          retention-days: 1
          if-no-files-found: error
