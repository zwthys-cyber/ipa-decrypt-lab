name: Inspect QQ call recording metadata
on:
  push:
    branches: [codex/qq-call-recording-inspection]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install age runtime
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Inspect existing encrypted QQ export without sending files
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_AGE_IDENTITY: ${{ secrets.DELIVERY_AGE_IDENTITY }}
        run: python3 .github/ops/qq_call_inspect.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qq-call-metadata
          path: qq-call-metadata.json
          retention-days: 7
          if-no-files-found: error
