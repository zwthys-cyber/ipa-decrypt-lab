name: Verify saved China model on a fresh runner
run-name: CN-saved-model-${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Public package preflight or verification with the saved independent CN model
        type: choice
        default: preflight
        options: [preflight, verify]
      app_id:
        description: Fixed free CN sample; choose the small cross-app control by default
        type: choice
        default: '1530340312'
        options: ['1530340312', '1661733229']
permissions:
  contents: read
  actions: read
concurrency:
  group: china-account-onboarding
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CN_SAMPLE_APP_ID: ${{ inputs.app_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check model binding and live-session privacy without secrets
        run: |
          python3 -m compileall -q .github/ops
          python3 -m unittest discover -s .github/ops -p 'test_*.py' -v
          node --test .github/ops/cn_action.test.cjs
      - name: Check the fixed free CN sample without credentials
        run: python3 .github/ops/cn_download_probe.py --metadata --app-id "$CN_SAMPLE_APP_ID"
      - name: Fetch the exact-source public Intel CN client and offline engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ops/cn_runtime.py fetch cn-runtime
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Verify public authentication resources without credentials
        run: cn-runtime/lab-kbsync --prewarm
      - name: Reuse only the saved CN model and its paired profile
        if: inputs.mode == 'verify'
        env:
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_GUID: ${{ secrets.APPLE_CN_GUID }}
          APPLE_CN_SESSION_B64: ${{ secrets.APPLE_CN_SESSION_B64 }}
          FAIRPLAY_CN_MODEL_B64: ${{ secrets.FAIRPLAY_CN_MODEL_B64 }}
          FAIRPLAY_CN_STATE_B64: ${{ secrets.FAIRPLAY_CN_STATE_B64 }}
          CN_LIVE_TASK: verify_cn_saved_model
          GH_TOKEN: ${{ github.token }}
          DELIVERY_AGE_IDENTITY: ${{ secrets.DELIVERY_AGE_IDENTITY }}
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/cn-runtime/lab-kbsync
        uses: ./.github/actions/cn-auth
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.mode == 'verify'
        with:
          name: cn-saved-model-result-${{ github.run_id }}
          path: |
            cn-saved-model-receipt.json
            cn-session-secret-relay.json
          retention-days: 1
          if-no-files-found: ignore
