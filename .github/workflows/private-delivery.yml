name: Private verified IPA delivery
run-name: delivery-${{ inputs.request_id }}-app${{ inputs.app_id }}-${{ inputs.runner || 'macos-26-intel' }}${{ inputs.version && format('-version{0}', inputs.version) || '' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify precompiled runtime, or export verified IPA as age ciphertext
        type: choice
        default: preflight
        options: [preflight, export]
      runner:
        description: GitHub-hosted macOS pool
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-15-intel]
      app_id:
        description: Free US App Store numeric ID
        type: string
        default: '6599842047'
      version:
        description: Optional exact display version or Apple external version ID
        type: string
        default: ''
      request_id:
        description: Opaque 32-character lowercase hex request ID
        type: string
        default: '00000000000000000000000000000001'
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: ${{ inputs.mode == 'preflight' && format('delivery-preflight-{0}', inputs.runner) || 'private-ipa-delivery' }}
  cancel-in-progress: ${{ inputs.mode == 'preflight' }}
jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-26-intel' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      LAB_BUILD_JOBS: ${{ endsWith(inputs.runner, '-intel') && '4' || '2' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check App Store eligibility before loading runtime
        id: eligibility
        if: inputs.mode == 'export'
        timeout-minutes: 1
        env:
          DELIVERY_APP_ID: ${{ inputs.app_id }}
          DELIVERY_VERSION: ${{ inputs.version }}
        run: python3 tools/app_preflight.py
      - name: App unavailable in US storefront
        if: failure() && steps.eligibility.outputs.eligibility == 'app_not_found_in_us'
        run: exit 1
      - name: Paid app unsupported
        if: failure() && steps.eligibility.outputs.eligibility == 'paid_app_not_supported'
        run: exit 1
      - name: IPA exceeds 2000 MB capacity
        if: failure() && steps.eligibility.outputs.eligibility == 'source_too_large'
        run: exit 1
      - name: App Store lookup unavailable
        if: failure() && steps.eligibility.outputs.eligibility == 'metadata_network_failed'
        run: exit 1
      - name: App Store metadata invalid
        if: failure() && steps.eligibility.outputs.eligibility == 'metadata_invalid_response'
        run: exit 1
      - name: Invalid App Store ID
        if: failure() && steps.eligibility.outputs.eligibility == 'invalid_app_id'
        run: exit 1
      - name: Prepare verified precompiled runtime
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/native_runtime.py fetch --output runtime
      - name: Restore fixed Apple resource cache
        id: apple-assets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: runtime/lab-kbsync --prewarm
      - name: Save validated Apple resources before account access
        if: steps.apple-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Export only after complete plaintext verification
        id: export
        if: inputs.mode == 'export'
        env:
          FAIRPLAY_MODEL_B64: ${{ secrets.FAIRPLAY_MODEL_B64 }}
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/runtime/lab-kbsync
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_2FA_CODE: ${{ secrets.APPLE_2FA_CODE }}
          GH_TOKEN: ${{ github.token }}
          DELIVERY_APP_ID: ${{ inputs.app_id }}
          DELIVERY_VERSION: ${{ inputs.version }}
          DELIVERY_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          ulimit -c 0
          python3 tools/private_export.py --binary runtime/ApplePackageTool --engine runtime/offline-engine --crypt runtime/delivery-crypt
      - name: IPA exceeds 2000 MB capacity
        if: failure() && steps.export.outputs.capacity_failure == 'size_limit'
        run: exit 1
      - name: Insufficient private workspace
        if: failure() && steps.export.outputs.capacity_failure == 'disk_limit'
        run: exit 1
      - name: Historical version unavailable
        if: failure() && steps.export.outputs.version_failure != ''
        run: exit 1
      - name: Apple login temporarily unavailable
        if: failure() && steps.export.outputs.authentication_failure == 'temporary_unavailable'
        run: exit 1
      - name: Apple login access denied
        if: failure() && steps.export.outputs.authentication_failure == 'access_denied'
        run: exit 1
      - name: Retain encrypted delivery for at most one day
        if: success() && inputs.mode == 'export'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-${{ inputs.request_id }}
          path: |
            delivery-out/package.ipa.age
            delivery-out/receipt.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Remove any delivery workspace
        if: always()
        run: rm -rf -- delivery-out
