name: Diagnose Store login
on:
  workflow_dispatch:
    inputs:
      auth_route:
        description: Compare advertised route with the client's built-in native Apple endpoint
        type: choice
        default: bag
        options: [bag, native]
      runner:
        description: GitHub-hosted macOS pool for login comparison
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-15-intel]
permissions:
  contents: read
  actions: read
concurrency:
  group: private-ipa-delivery
  cancel-in-progress: false
jobs:
  login:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-26-intel' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare verified precompiled runtime
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/native_runtime.py fetch --output runtime
      - name: Restore fixed Apple resource cache
        id: apple-assets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: runtime/lab-kbsync --prewarm
      - name: Save validated Apple resources before account access
        if: steps.apple-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Bounded login with fixed diagnostic fields only
        env:
          LOGIN_EXPECTED_APPLE_ID: ${{ secrets.LOGIN_EXPECTED_APPLE_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_2FA_CODE: ${{ secrets.APPLE_2FA_CODE }}
          LAB_NATIVE_AUTH_ROUTE: ${{ inputs.auth_route == 'native' && '1' || '0' }}
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/runtime/lab-kbsync
        run: |
          ulimit -c 0
          python3 - <<'PY'
          import json, os, re, sys
          from urllib.parse import urlsplit
          from pathlib import Path
          sys.path.insert(0, "tools")
          import native_store
          from native_store import authenticate, classify, run
          def http_trace(raw):
              records = []
              for line in raw.splitlines():
                  request = re.search(r">>> (GET|POST) (https://\S+)", line)
                  if request:
                      url = urlsplit(request.group(2))
                      path = url.path.rstrip("/")
                      kind = ("bag" if url.hostname == "init.itunes.apple.com" and path == "/bag.xml" else
                              "native_auth" if url.hostname == "auth.itunes.apple.com" and path == "/auth/v1/native/fast" else
                              "legacy_auth" if path == "/WebObjects/MZFinance.woa/wa/authenticate"
                                  and (url.hostname == "buy.itunes.apple.com" or re.fullmatch(r"p[0-9]+-buy\.itunes\.apple\.com", url.hostname or "")) else "other")
                      records.append({"endpoint":kind,"method":request.group(1)})
                  status = re.search(r"<<< ([1-5][0-9]{2})(?: \(([0-9]{1,8}) bytes\))?", line)
                  if status:
                      if not records:
                          records.append({"endpoint":"unknown"})
                      records[-1]["status"] = int(status.group(1))
                      if status.group(2):
                          records[-1]["body_bytes"] = int(status.group(2))
                  if records and "status" in records[-1]:
                      content = re.search(r"(?i)content-type:\s*(.+)", line)
                      if content:
                          value = content.group(1).lower()
                          records[-1]["content_type"] = next((name for name in
                              ("text/html","text/xml","application/xml","application/x-apple-plist","application/json")
                              if value.startswith(name)), "other")
              return records[-12:]
          synthetic = http_trace(">>> POST https://user:private@auth.itunes.apple.com/auth/v1/native/fast/?private=token\n<<< 403 (12 bytes)\nContent-Type: text/html\nSet-Cookie: private")
          assert synthetic == [{"endpoint":"native_auth","method":"POST","status":403,"body_bytes":12,"content_type":"text/html"}]
          original_classify = native_store.classify
          def classify_transient_response(result):
              state = original_classify(result)
              if state == "authenticated":
                  return state
              raw = (result.stdout or "") + "\n" + (result.stderr or "")
              trace = http_trace(raw)
              last = trace[-1] if trace else {}
              if last.get("endpoint") in ("native_auth", "legacy_auth"):
                  if last.get("status") in (204, 500, 502, 503, 504):
                      return "native_auth_service_unavailable"
                  if last.get("status") == 403 and last.get("content_type") == "text/html":
                      return "native_auth_service_unavailable"
              return state
          native_store.classify = classify_transient_response
          native_store.AUTH_DELAYS = (10, 20)
          candidate = os.environ.get("LOGIN_EXPECTED_APPLE_ID", "").strip().casefold()
          if candidate:
              print(json.dumps({"schema":"login-account-comparison-v1",
                                "matches":candidate == os.environ["APPLE_ID"].strip().casefold()}), flush=True)
          binary = str(Path("runtime/ApplePackageTool").resolve())
          env = {k: os.environ[k] for k in ("HOME", "PATH", "LANG", "LAB_KBSYNC_HELPER", "LAB_NATIVE_AUTH_ROUTE") if k in os.environ}
          env["APPLEPACKAGE_PASSWORD"] = os.environ["APPLE_PASSWORD"]
          args = ["login", os.environ["APPLE_ID"].strip(), "--verbose"]
          if os.environ.get("APPLE_2FA_CODE"):
              args += ["--code", os.environ["APPLE_2FA_CODE"]]
          try:
              result = authenticate(binary, args, env)
              raw = (result.stdout or "") + "\n" + (result.stderr or "")
              lower = raw.lower()
              categories = {
                  "account_disabled": ("account has been disabled", "account is disabled", "account locked", "locked for security"),
                  "credentials_rejected": ("incorrect password", "password is incorrect", "invalid credentials", "incorrect apple"),
                  "account_review": ("review your account", "not yet been used", "complete your account", "verification failed"),
                  "terms_required": ("terms and conditions", "terms of service", "accepting terms"),
                  "missing_account_info": ("missing accountinfo", "missing address"),
                  "missing_account_fields": ("unable to read",),
                  "server_unavailable": ("service unavailable", "temporarily unavailable", "try again later"),
                  "response_parse": ("propertylist", "not a dictionary", "decodingerror", "data is not in the correct format"),
                  "bad_login": ("badlogin", "authentication failed"),
                  "verification": ("verification code", "2fa", "two-factor"),
                  "redirect": ("redirect",),
                  "device_limit": ("too many", "maximum number", "associated with", "device limit"),
                  "keychain": ("keychain", "security framework"),
                  "permission": ("permission denied", "operation not permitted"),
                  "tls": ("ssl", "tls", "certificate"),
                  "connection": ("connection", "socket", "httpclienterror"),
                  "signing": ("sap", "signature"),
              }
              endpoints = {
                  "bag": "init.itunes.apple.com/bag.xml",
                  "native_auth": "auth.itunes.apple.com/auth/v1/native/fast",
                  "legacy_auth": "/WebObjects/MZFinance.woa/wa/authenticate",
              }
              print(json.dumps({"schema":"login-detail-v1",
                  "flags":[key for key, terms in categories.items() if any(term in lower for term in terms)],
                  "request_endpoints":[key for key, marker in endpoints.items() if marker in raw],
                  "response_statuses":[int(v) for v in re.findall(r"<<< ([1-5][0-9]{2})\b", raw)][-12:],
                  "failure_codes":[int(v) for v in re.findall(r"failureType:\s*(-?[0-9]{1,5})(?![0-9])", raw)][-4:],
                  "error_codes":[int(v) for v in re.findall(r"\bCode\s*=\s*(-?[0-9]{1,6})(?![0-9])", raw)][-4:],
              }), flush=True)
              print(json.dumps({"schema":"login-http-trace-v1",
                  "native_route_requested":env.get("LAB_NATIVE_AUTH_ROUTE") == "1",
                  "native_route_supported":b"LAB_NATIVE_AUTH_ROUTE" in Path(binary).read_bytes(),
                  "requests":http_trace(raw)}), flush=True)
              successful = classify(result) == "authenticated"
          finally:
              try:
                  run(binary, ["logout", os.environ["APPLE_ID"].strip()], env, timeout=15)
              except Exception:
                  pass
          sys.exit(0 if successful else 2)
          PY
