          }
          static id observe(id cls,SEL sel,id response,long long type,id bag,id account) {
           id pending=((id(*)(id,SEL,id,long long,id,id))original)(cls,sel,response,type,type==2&&nativeBag?nativeBag:bag,account);
           NSError *error=nil; id result=pending;
           SEL wait=NSSelectorFromString(@"resultWithError:");
