           if(promise)request=((id(*)(id,SEL,NSError **))objc_msgSend)(pending,wait,NULL);
           if([request isKindOfClass:NSURLRequest.class]&&[[@[@"bag.itunes.apple.com",@"init.itunes.apple.com"] filteredArrayUsingPredicate:[NSPredicate predicateWithFormat:@"SELF == %@",[request URL].host]] count]>0) {
            NSData *route=[NSJSONSerialization dataWithJSONObject:@{@"schema":@"store-bag-original-route-v1",@"path":[request URL].path?:@"",@"method":[request HTTPMethod]?:@""} options:0 error:NULL];
            fprintf(stderr,"IPA_LAB_SP_DIAG:%s\n",[[NSString alloc]initWithData:route encoding:NSUTF8StringEncoding].UTF8String);
