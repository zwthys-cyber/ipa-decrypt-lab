           NSArray *domains=@[@"AMSErrorDomain",@"NSURLErrorDomain",@"NSCocoaErrorDomain",@"NSPOSIXErrorDomain",@"AKAnisetteError",@"com.apple.AppleMediaServices"];
           NSMutableArray *errors=[NSMutableArray array];
           for(unsigned i=0;error&&i<5;i++) {
            NSMutableArray *flags=[NSMutableArray array];
            NSString *message=[error.description lowercaseString];
            for(NSString *term in @[@"bag",@"url",@"missing",@"invalid",@"provision",@"account",@"permission",@"entitlement",@"unsupported",@"response",@"parse",@"network",@"certificate",@"amsbag",@"client",@"400",@"key",@"profile",@"timeout",@"decode",@"coder",@"archive",@"class",@"transport",@"settinginfo",@"machine",@"secure",@"reply",@"data",@"object",@"guid",@"serialize",@"deserialize",@"format",@"plist"]) if([message containsString:term]) [flags addObject:term];
            NSString *endpoint=@"other";
            id location=error.userInfo[@"AMSURL"];
            NSURL *url=[location isKindOfClass:NSURL.class]?location:([location isKindOfClass:NSString.class]?[NSURL URLWithString:location]:nil);
            if([@[@"init.itunes.apple.com",@"bag.itunes.apple.com"] containsObject:url.host]) endpoint=url.host;
            NSString *bagKey=@"unknown";
            NSRegularExpression *regex=[NSRegularExpression regularExpressionWithPattern:@"retrieve ([a-zA-Z0-9_-]{1,80})" options:0 error:NULL];
            NSTextCheckingResult *match=[regex firstMatchInString:message options:0 range:NSMakeRange(0,message.length)];
            if(match)bagKey=[message substringWithRange:[match rangeAtIndex:1]];
            NSString *coderKey=@"unknown";
            NSRegularExpression *keyRegex=[NSRegularExpression regularExpressionWithPattern:@"key ['\"]([A-Za-z_.-]{1,64})['\"]" options:0 error:NULL];
            NSTextCheckingResult *keyMatch=[keyRegex firstMatchInString:message options:0 range:NSMakeRange(0,message.length)];
            if(keyMatch)coderKey=[message substringWithRange:[keyMatch rangeAtIndex:1]];
            [errors addObject:@{@"domain":[domains containsObject:error.domain]?error.domain:@"other",@"endpoint":endpoint,@"bag_key":bagKey,@"coder_key":coderKey,@"flags":flags,@"code":@(MAX(-999999,MIN(999999,error.code)))}];
            error=error.userInfo[NSUnderlyingErrorKey];
           }
           NSString *kind=result?NSStringFromClass([result class]):@"nil";
           if(kind.length>80||[kind rangeOfCharacterFromSet:[NSCharacterSet characterSetWithCharactersInString:@"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_"].invertedSet].location!=NSNotFound)kind=@"other";
           NSDictionary *safe=@{@"bag_response":@([response isKindOfClass:NSHTTPURLResponse.class]&&[[response URL].host isEqualToString:@"init.itunes.apple.com"]),@"native_bag":@(nativeBag!=nil),@"retry_action":@(actionRetry),@"result_class":kind,@"schema":@"store-sp-result-v1",@"pending":@([pending respondsToSelector:wait]),@"result_present":@(result!=nil),@"result_number":@([result isKindOfClass:NSNumber.class]),@"result_bool":@([result isKindOfClass:NSNumber.class]&&[result boolValue]),@"action_data_present":@(actionData),@"status":@([response isKindOfClass:NSHTTPURLResponse.class]?[response statusCode]:0),@"type":@(type==2?2:0),@"errors":errors};
