           SEL bagSelector=NSSelectorFromString(@"createBagForSubProfile");
           unsigned count=0; Method *methods=class_copyMethodList(NSClassFromString(@"AMSBag"),&count);
           NSMutableArray *names=[NSMutableArray array];
           for(unsigned i=0;i<count;i++) { NSString *name=NSStringFromSelector(method_getName(methods[i])); if([name containsString:@"URL"]||[name containsString:@"Dictionary"]||[name containsString:@"Overlay"]||[name containsString:@"Value"]) [names addObject:name]; }
