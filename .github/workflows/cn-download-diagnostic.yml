name: Diagnose one CN download failure
run-name: CN-download-diagnostic
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify precompiled runtime, or export verified IPA as age ciphertext
        type: choice
        default: preflight
        options: [preflight, diagnose, existing_entitlement, response_control]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: ${{ inputs.mode == 'preflight' && 'cn-delivery-preflight' || 'private-ipa-delivery' }}
  cancel-in-progress: ${{ inputs.mode == 'preflight' }}
jobs:
  native:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      DELIVERY_ACCOUNT_PROFILE: cn
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe only the public runner egress country before private inputs
        run: |
          python3 - <<'PY'
          import json,re,urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          country="unknown"
          try:
              opener=urllib.request.build_opener(NoRedirect())
              with opener.open("https://ipinfo.io/country",timeout=10) as response:
                  value=response.read(16).decode().strip()
              if re.fullmatch("[A-Z]{2}",value):country=value
          except Exception:pass
          print(json.dumps({"schema":"cn-runner-egress-v1","country":country,"ip_published":False}))
          PY
      - name: Test closed diagnostics before account access
        run: |
          python3 -m unittest discover -s .github/ops -p 'test_cn_delivery_diagnostic.py'
      - name: Check App Store eligibility before loading runtime
        id: eligibility
        if: inputs.mode != 'preflight'
        timeout-minutes: 1
        env:
          DELIVERY_APP_ID: 1142110895
        run: python3 tools/app_preflight.py
      - name: App unavailable in CN storefront
        if: failure() && steps.eligibility.outputs.eligibility == 'app_not_found_in_cn'
        run: exit 1
      - name: Paid app unsupported
        if: failure() && steps.eligibility.outputs.eligibility == 'paid_app_not_supported'
        run: exit 1
      - name: IPA exceeds 2000 MB capacity
        if: failure() && steps.eligibility.outputs.eligibility == 'source_too_large'
        run: exit 1
      - name: App Store lookup unavailable
        if: failure() && steps.eligibility.outputs.eligibility == 'metadata_network_failed'
        run: exit 1
      - name: App Store metadata invalid
        if: failure() && steps.eligibility.outputs.eligibility == 'metadata_invalid_response'
        run: exit 1
      - name: Invalid App Store ID
        if: failure() && steps.eligibility.outputs.eligibility == 'invalid_app_id'
        run: exit 1
      - name: Prepare verified precompiled runtime
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ops/cn_runtime.py fetch runtime
      - name: Restore fixed Apple resource cache
        id: apple-assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - name: Prepare pinned Apple assets without account credentials
        timeout-minutes: 4
        run: runtime/lab-kbsync --prewarm
      - name: Save validated Apple resources before account access
        if: steps.apple-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/AppleMediaServices
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/commerce
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP
            ~/Library/Caches/ipatool/sap/apple-assets-macos-27-26A434-arm64-v1/CoreFP.icxs
          key: apple-public-assets-d9c0247-26A434-arm64-v1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Lakr233/ApplePackage
          ref: 391bfe6ee6598d73e4f94b88b38b50bd6f6ec67b
          path: native-source/ApplePackage
          persist-credentials: false
      - name: Instrument the pinned native purchase parser without changing requests
        env:
          CN_LICENSE_CONTROL: ${{ inputs.mode }}
        run: |
          python3 tools/patch_swift_diagnostics.py native-source/ApplePackage
          python3 tools/patch_ent_download.py native-source/ApplePackage
          python3 .github/ops/patch_cn_login.py native-source/ApplePackage
          python3 .github/ops/patch_cn_purchase_trace.py native-source/ApplePackage
      - name: Restore public compilation cache without saving diagnostic binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native-source/ApplePackage/.build
          key: cn-purchase-diagnostic-v1-${{ github.sha }}
          restore-keys: |
            cn-live-auth-macos26-x64-xcode26.2-
      - name: Build and verify instrumented native client before account access
        working-directory: native-source/ApplePackage
        run: |
          swift build -j 4 --build-tests
          swift test --skip-build --filter 'SAPAuthenticationRequestTests|LabEntDownloadTests|LabAuthRouteTests|LabStoreAMD|LabCNLoginFlowTests|LabCNSummaryTests|LabCNPurchaseTraceTests'
          swift build -j 4 --product ApplePackageTool
      - name: Use the explicitly tested diagnostic client only in this job
        run: cp native-source/ApplePackage/.build/debug/ApplePackageTool runtime/ApplePackageTool
      - name: Export only after complete plaintext verification
        id: export
        if: inputs.mode != 'preflight'
        env:
          CN_LICENSE_CONTROL: ${{ inputs.mode }}
          FAIRPLAY_CN_MODEL_B64: ${{ secrets.FAIRPLAY_CN_MODEL_B64 }}
          FAIRPLAY_CN_STATE_B64: ${{ secrets.FAIRPLAY_CN_STATE_B64 }}
          LAB_KBSYNC_HELPER: ${{ github.workspace }}/runtime/lab-kbsync
          APPLE_CN_ID: ${{ secrets.APPLE_CN_ID }}
          APPLE_CN_GUID: ${{ secrets.APPLE_CN_GUID }}
          APPLE_CN_SESSION_B64: ${{ secrets.APPLE_CN_SESSION_B64 }}
          GH_TOKEN: ${{ github.token }}
          DELIVERY_APP_ID: 1142110895
          DELIVERY_REQUEST_ID: cn_81c1b5645085432e87f8ec42d4139771
        run: python3 .github/ops/cn_delivery_diagnostic.py --binary runtime/ApplePackageTool --engine runtime/offline-engine --crypt runtime/delivery-crypt
      - name: IPA exceeds 2000 MB capacity
        if: failure() && steps.export.outputs.capacity_failure == 'size_limit'
        run: exit 1
      - name: Insufficient private workspace
        if: failure() && steps.export.outputs.capacity_failure == 'disk_limit'
        run: exit 1
      - name: CN session requires maintenance
        if: failure() && steps.export.outputs.authentication_failure == 'cn_session_maintenance'
        run: exit 1
      - name: Apple login temporarily unavailable
        if: failure() && steps.export.outputs.authentication_failure == 'temporary_unavailable'
        run: exit 1
      - name: Apple login access denied
        if: failure() && steps.export.outputs.authentication_failure == 'access_denied'
        run: exit 1
      - name: Retain closed download diagnosis only
        if: always() && inputs.mode != 'preflight'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cn-download-diagnostic-${{ github.run_id }}
          path: cn-download-diagnostic.json
          retention-days: 1
          if-no-files-found: error
      - name: Retain only the fully verified encrypted control result
        if: success() && (inputs.mode == 'existing_entitlement' || inputs.mode == 'response_control')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cn-existing-entitlement-${{ github.run_id }}
          path: |
            delivery-out/package.ipa.age
            delivery-out/receipt.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Remove any delivery workspace
        if: always()
        run: rm -rf -- delivery-out
