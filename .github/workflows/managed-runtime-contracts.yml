name: Managed runtime contracts
on:
  pull_request:
    paths:
      - 'tools/telegram_daemon.py'
      - 'tools/multi_user.py'
      - 'tests/test_managed_runtime.py'
      - 'tests/test_managed_state_transport.py'
      - 'tools/tf_state_http.py'
      - 'tools/managed_migration.py'
      - 'tests/test_managed_migration.py'
      - 'tools/testflight_state.py'
      - '.github/ops/tf_task*.py'
      - '.github/workflows/testflight-private-delivery.yml'
      - 'deploy/managed/**'
      - '.github/workflows/managed-runtime-contracts.yml'
  workflow_dispatch:
    inputs:
      build_images:
        description: Optional container image build; requires the existing public Bot API cache
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native architecture and run managed runtime tests
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          /usr/bin/python3 -m unittest discover -s tests -p 'test_managed*.py' -v
          /usr/bin/python3 -m unittest discover -s .github/ops -p 'test_tf_task*.py' -v
          node --test deploy/managed/cloudflare/worker.test.mjs deploy/managed/free-pilot/worker.test.mjs deploy/managed/free-pilot/private-link.test.mjs deploy/managed/free-pilot/drive-auth.test.mjs deploy/managed/free-pilot/drive-smoke.test.mjs
          /usr/bin/python3 deploy/managed/free-pilot/test_sql.py -v
          /usr/bin/python3 deploy/managed/free-pilot/test_link_sql.py -v
          /usr/bin/python3 deploy/managed/free-pilot/test_private_upload.py -v
          /usr/bin/python3 deploy/managed/free-pilot/test_zip_preflight.py -v
          /usr/bin/python3 deploy/managed/free-pilot/test_archive_verify.py -v
          /usr/bin/python3 deploy/managed/free-pilot/test_private_cleanup.py -v
  arm64_delivery_helper:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FiloSottile/age
          ref: b74dce4cdbe35b5e5f66c06d9612b72f89028758
          path: native-source/age
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
          cache-dependency-path: native-source/age/go.sum
      - name: Verify and package native ARM64 delivery helper
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(go env GOARCH)" = arm64
          mkdir -p native-source/age/cmd/lab-delivery-crypt arm64-delivery
          cp tools/delivery_crypto.go native-source/age/cmd/lab-delivery-crypt/main.go
          cp tests/delivery_crypto_test.go native-source/age/cmd/lab-delivery-crypt/main_test.go
          (
            cd native-source/age
            go test -p 2 -timeout 300s ./cmd/lab-delivery-crypt
            CGO_ENABLED=0 go build -p 2 -trimpath -o ../../arm64-delivery/delivery-crypt ./cmd/lab-delivery-crypt
          )
          cd arm64-delivery
          LC_ALL=C readelf -h delivery-crypt | grep -E 'Machine:[[:space:]]+AArch64'
          printf 'source_commit=%s\narchitecture=arm64\n' "$GITHUB_SHA" > BUILDINFO
          sha256sum delivery-crypt BUILDINFO > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm64-delivery-helper-${{ github.sha }}
          path: arm64-delivery/
          retention-days: 7
          if-no-files-found: error
  workerd:
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned local simulator only
        working-directory: deploy/managed/free-pilot
        run: npm install --no-save --package-lock=false --no-audit --no-fund miniflare@4.20260730.0
      - name: Verify actual local workerd D1 bindings
        working-directory: deploy/managed/free-pilot
        run: node --test workerd.integration.mjs
  pilot_bundle:
    needs: [synthetic, workerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned public bundler only
        working-directory: deploy/managed/free-pilot
        run: npm install --no-save --package-lock=false --no-audit --no-fund esbuild@0.28.2
      - name: Package a disabled-by-default browser deployment candidate
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          root=deploy/managed/free-pilot
          mkdir -p pilot-dist/migrations
          "$root/node_modules/.bin/esbuild" "$root/worker.mjs" --bundle --platform=browser --format=esm --target=es2022 --outfile=pilot-dist/worker.mjs
          cp "$root"/migrations/000[1-4]_*.sql pilot-dist/migrations/
          cp "$root/wrangler.example.json" "$root/private_upload.py" "$root/private_cleanup.py" "$root/zip_preflight.py" "$root/archive_verify.py" "$root/DEPLOY.zh-CN.md" pilot-dist/
          cat pilot-dist/migrations/000[1-4]_*.sql > pilot-dist/schema-fresh.sql
          printf 'source_head=%s\nchecked_out_commit=%s\n' "$SOURCE_HEAD" "$(git rev-parse HEAD)" > pilot-dist/BUILDINFO
          node --check pilot-dist/worker.mjs
          node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import worker from "./pilot-dist/worker.mjs";
          assert.equal((await worker.fetch(new Request("https://pilot.example.invalid/telegram",{method:"POST"}),{})).status,503);
          assert.equal((await worker.fetch(new Request("https://pilot.example.invalid/telegram"),{})).status,404);
          JS
          python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          root=Path("pilot-dist")
          config=json.loads((root/"wrangler.example.json").read_text())
          assert config["workers_dev"] is False and config["preview_urls"] is False
          assert config["vars"]=={"PILOT_ENABLED":"0","PILOT_LINK_ENABLED":"0"}
          assert config["d1_databases"][0]["database_id"]=="REPLACE_WITH_ISOLATED_FREE_D1_ID"
          db=sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys=ON")
          db.executescript((root/"schema-fresh.sql").read_text())
          assert "retired_at" in {r[1] for r in db.execute("PRAGMA table_info(pilot_links)")}
          assert db.execute("PRAGMA foreign_key_check").fetchall()==[]
          db.close()
          PY
          (cd pilot-dist && sha256sum worker.mjs schema-fresh.sql BUILDINFO DEPLOY.zh-CN.md wrangler.example.json private_upload.py private_cleanup.py zip_preflight.py archive_verify.py migrations/*.sql > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: free-pilot-deployment-${{ github.sha }}
          path: pilot-dist/
          retention-days: 7
          if-no-files-found: error
  linux_archive_bundle:
    needs: synthetic
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm Linux architecture and run local synthetic contracts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "$EXPECTED_ARCH"
          python3 deploy/managed/free-pilot/test_archive_verify.py -v
          python3 deploy/managed/free-pilot/test_private_upload.py -v
      - name: Full-read exact 10 GB synthetic ZIP64 contract
        run: timeout 240s python3 deploy/managed/free-pilot/test_archive_10gb.py
      - name: Build standalone Linux verification and operator upload tools
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          root=deploy/managed/free-pilot
          mkdir -p linux-archive-dist "$RUNNER_TEMP/archive-src" "$RUNNER_TEMP/archive-smoke" "$RUNNER_TEMP/upload-src"
          cp "$root/archive_verify.py" "$RUNNER_TEMP/archive-src/__main__.py"
          cp "$root/zip_preflight.py" "$RUNNER_TEMP/archive-src/"
          python3 -m zipapp "$RUNNER_TEMP/archive-src" -o linux-archive-dist/archive-verify.pyz
          cp "$root/private_upload.py" "$root/archive_verify.py" "$root/zip_preflight.py" "$RUNNER_TEMP/upload-src/"
          # zipapp -m calls main() without propagating its return value.
          # Preserve the operator tool's fail-closed exit status in the executable.
          printf 'from private_upload import main\nraise SystemExit(main())\n' > "$RUNNER_TEMP/upload-src/__main__.py"
          python3 -m zipapp "$RUNNER_TEMP/upload-src" -o linux-archive-dist/private-upload.pyz
          cp "$root/LINUX-ARCHIVE.zh-CN.md" linux-archive-dist/README.md
          printf 'source_head=%s\nchecked_out_commit=%s\n' "$SOURCE_HEAD" "$(git rev-parse HEAD)" > linux-archive-dist/BUILDINFO
          printf 'validated_host=%s\npython_version=%s\n' "$(uname -m)" "$(python3 --version)" >> linux-archive-dist/BUILDINFO
          cp linux-archive-dist/*.pyz "$RUNNER_TEMP/archive-smoke/"
          cp "$root/test_private_upload.py" "$RUNNER_TEMP/archive-smoke/"
          cd "$RUNNER_TEMP/archive-smoke"
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          with zipfile.ZipFile("Synthetic.ipa","w") as z:
              z.writestr("Payload/Synthetic.app/Info.plist", b"synthetic layout only")
              z.writestr("Payload/Synthetic.app/resource.bin", b"test")
          os.chmod("Synthetic.ipa",0o600)
          digest=hashlib.sha256(open("Synthetic.ipa","rb").read()).hexdigest()
          args=[sys.executable,"archive-verify.pyz","Synthetic.ipa","--confirm-authorized-file","--expected-sha256",digest]
          result=json.loads(subprocess.check_output(args))
          assert result["all_member_crc_verified"] is True and result["sha256"]==digest
          assert result["ipa_layout_present"] and result["expected_sha256_matched"]
          assert result["authenticity_verified"] is False and result["drm_status_verified"] is False
          args[-1]="0"*64
          assert subprocess.run(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==2
          print("relocated_archive_tool_verified")
          # Real CLI must refuse production uploads on Actions. No real credentials
          # or real HTTP transport are used by the synthetic tests.
          assert os.environ.get("GITHUB_ACTIONS")=="true"
          args=[sys.executable,"private-upload.pyz","--file","Synthetic.ipa","--job","pilot_"+"a"*32,
                "--journal","unused","--confirm-authorized-file","--confirm-free-account"]
          result=subprocess.run(args,capture_output=True,text=True)
          assert result.returncode==2 and result.stderr.strip()=="operator_only_no_live_ci_upload"
          assert not os.path.exists("unused")
          print("packaged_upload_ci_guard_verified")
          PY
          PYTHONPATH="$PWD/private-upload.pyz" python3 test_private_upload.py -v
          cd "$GITHUB_WORKSPACE/linux-archive-dist"
          sha256sum archive-verify.pyz private-upload.pyz README.md BUILDINFO > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-archive-tools-${{ matrix.arch }}-${{ github.sha }}
          path: linux-archive-dist/
          retention-days: 7
          if-no-files-found: error
  images:
    # Not part of the zero-cost control-plane pilot; never provision a host here.
    if: github.event_name == 'workflow_dispatch' && inputs.build_images
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: dist/telegram-bot-api
          key: telegram-bot-api-ubuntu24-x64-e3e9dd8e5b3d7ab-v1
          fail-on-cache-miss: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FiloSottile/age
          ref: b74dce4cdbe35b5e5f66c06d9612b72f89028758
          path: native-source/age
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
          cache-dependency-path: native-source/age/go.sum
      - name: Build public helper and assemble isolated context
        run: |
          mkdir -p native-source/age/cmd/lab-delivery-crypt package/bin package/tools
          cp tools/delivery_crypto.go native-source/age/cmd/lab-delivery-crypt/main.go
          cp tests/delivery_crypto_test.go native-source/age/cmd/lab-delivery-crypt/main_test.go
          (cd native-source/age && go test -p 2 -timeout 300s ./cmd/lab-delivery-crypt && CGO_ENABLED=0 go build -p 2 -trimpath -o ../../package/bin/delivery-crypt ./cmd/lab-delivery-crypt)
          cp dist/telegram-bot-api package/bin/
          for module in testflight_state tf_state_http account_profile version_catalog app_presentation version_request app_preflight capacity telegram_daemon multi_user persistent_journal telegram_controller telegram_runtime telegram_api telegram_menu telegram_queue task_progress delivery_scheduler ipa_audit managed_migration; do
            cp "tools/$module.py" package/tools/
          done
          printf '%s\n' "$GITHUB_SHA" > package/SOURCE_COMMIT
      - name: Build two images and check fail-closed startup
        run: |
          for role in controller state; do
            docker build --platform linux/amd64 --target "$role" -f deploy/managed/Dockerfile -t "ipazake-$role:$GITHUB_SHA" package
            docker run --rm --network none --entrypoint /usr/bin/python3 "ipazake-$role:$GITHUB_SHA" -c 'import os,sys; sys.path.insert(0,"/opt/ipazake/tools"); import telegram_daemon,tf_state_http; assert os.geteuid()==10001'
            if docker run --rm --network none "ipazake-$role:$GITHUB_SHA"; then echo missing_volume_not_rejected; exit 1; fi
          done
          docker run --rm --network none --entrypoint /opt/ipazake/bin/telegram-bot-api "ipazake-controller:$GITHUB_SHA" --version
      - name: Export build-only images and checksums
        run: |
          mkdir -p managed-images
          for role in controller state; do
            docker save "ipazake-$role:$GITHUB_SHA" | gzip -n > "managed-images/$role.tar.gz"
          done
          (cd managed-images && sha256sum controller.tar.gz state.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: managed-images-${{ github.sha }}
          path: managed-images/
          retention-days: 3
          if-no-files-found: error
