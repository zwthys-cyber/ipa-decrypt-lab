version: 2.1

functions:
  setup-python: github.com/circleci-functions/setup-python@v0.5.0
  setup-node: github.com/circleci-functions/setup-node@v0.6.0

jobs:
  archive-audit:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup-python:
          with:
            python-version: "3.12"
      - run:
          name: Install the unittest JUnit reporter
          command: python3 -m pip install unittest-xml-reporting==3.2.0
      - run: circleci testsuite run "Archive audit"
      - store_test_results:
          path: test-results/archive-audit
  free-pilot:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup-python:
          with:
            python-version: "3.12"
      - setup-node:
          with:
            node-version: "22"
      - run:
          name: Install the unittest JUnit reporter
          command: python3 -m pip install unittest-xml-reporting==3.2.0
      - run:
          name: Install the pinned Worker bundler
          working_directory: deploy/managed/free-pilot
          command: npm install --no-save --package-lock=false --no-audit --no-fund esbuild@0.28.2
      - run:
          name: Build the Worker and check its syntax
          command: |
            root=deploy/managed/free-pilot
            mkdir -p pilot-dist
            "$root/node_modules/.bin/esbuild" "$root/worker.mjs" --bundle --platform=browser --format=esm --target=es2022 --outfile=pilot-dist/worker.mjs
            node --check pilot-dist/worker.mjs
      - run: circleci testsuite run "Free pilot Python"
      - run: circleci testsuite run "Free pilot Worker"
      - store_test_results:
          path: test-results/free-pilot

workflows:
  starter:
    jobs:
      - archive-audit
      - free-pilot
